<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeskCortex · Curadoria técnica</title>
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#172b37;background:#edf2f4}*{box-sizing:border-box}body{margin:0}header{background:#102d38;color:#fff;padding:32px 5vw}header small{color:#77d5c6;letter-spacing:2px}h1{font-size:32px;margin:8px 0}header p{max-width:850px;line-height:1.6;color:#d0e0e4}.metrics{display:flex;gap:28px;flex-wrap:wrap;margin-top:24px}.metrics b{display:block;font-size:25px}.metrics span{font-size:13px;color:#b8d2d9}main{padding:24px 5vw}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}input,select{padding:12px;border:1px solid #b9cbd2;border-radius:8px;font:inherit;background:white}input{flex:1;min-width:240px}button{font:inherit;cursor:pointer}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px}.list{max-height:80vh;overflow:auto}.item{display:block;width:100%;text-align:left;background:white;border:1px solid #d3dfe4;border-radius:10px;padding:16px;margin-bottom:10px;color:inherit}.item:hover,.item.active{border-color:#127c71;box-shadow:inset 4px 0 #127c71}.item strong{display:block;margin:8px 0;line-height:1.4}.tag{font-size:11px;display:inline-block;background:#e8eff3;border-radius:5px;padding:4px 7px;margin:2px 4px 2px 0}.draft,.needs_review{background:#fff0d3;color:#7a4c00}.approved{background:#d3f2df;color:#175a33}.rejected{background:#fbe0df;color:#8d2925}article{background:white;padding:28px;border:1px solid #d3dfe4;border-radius:12px;min-width:0}h2{margin:8px 0 15px;font-size:25px}h3{font-size:17px;margin-top:28px}.summary{font-size:17px;line-height:1.6}.claim{border-top:1px solid #e3eaed;padding:15px 0;line-height:1.55}.claim p{margin:8px 0}details{background:#f5f8f9;border-radius:6px;padding:10px;margin-top:8px}summary{cursor:pointer;font-size:13px;color:#246679}blockquote{margin:12px 0;border-left:3px solid #84b6bb;padding:6px 15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:300px;overflow:auto}.limit{background:#fff6e5;padding:15px 20px;border-radius:8px;line-height:1.6}.limit li{margin-bottom:8px}a{color:#146c78}code{overflow-wrap:anywhere;font-size:12px}.muted{color:#5d7480;font-size:13px}.related{border:1px solid #b5d2d6;background:#eff8f7;padding:8px;border-radius:6px;margin:3px}.empty{padding:25px;color:#526e7c}@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:320px}article{padding:18px}header{padding:24px}main{padding:16px}}
</style>
<header><small>DESKCORTEX / ALTERNATIVA</small><h1>Conhecimento com evidência</h1><p>Piloto NF-e e Safetech. Cada afirmação abre o trecho original que a sustenta. As fichas aguardam revisão técnica; agrupamentos automáticos são pistas para investigação.</p><div class="metrics" id="metrics"></div></header>
<main><div class="toolbar"><input id="q" aria-label="Pesquisar fichas" placeholder="Cole o erro, a SQL ou descreva o problema…"><select id="module" aria-label="Módulo"><option value="">Todos os módulos</option><option>NF-e</option><option>Safetech</option></select><select id="kind" aria-label="Tipo"><option value="curated">Fichas estruturadas</option><option value="">Fichas + agrupamentos</option><option value="candidate">Agrupamentos para revisar</option></select><select id="status" aria-label="Status"><option value="">Todos os estados</option><option value="draft">Rascunho</option><option value="approved">Aprovado</option><option value="needs_review">Revisão necessária</option><option value="rejected">Rejeitado</option></select></div><p class="muted" id="count"></p><div class="layout"><nav class="list" id="list" aria-label="Resultados"></nav><article id="detail"></article></div></main>
<script type="application/json" id="data">__CURATION_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),cards=data.cards;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),labels={draft:'Rascunho',approved:'Aprovado',needs_review:'Revisão necessária',rejected:'Rejeitado'};
const fields={finding:'Constatação no caso',procedure:'Procedimento documentado',context:'Contexto',symptom:'Sintoma',signature:'Assinatura técnica',outcome:'Resultado registrado',limitation:'Limite da evidência',cause:'Causa documentada',correction:'Correção documentada',prerequisite:'Pré-requisito',source_excerpt:'Trecho para triagem'};
let selected=null;
function score(c,q){const words=[...new Set(norm(q).match(/[a-z0-9_]+/g)||[])].filter(w=>!('a o as os de da do das dos e em um uma para por no na nos nas com como que eu meu minha esta estou erro problema fazer fica nao ao pelo pela mais esse essa tem esta la'.split(' ').includes(w)));let t=norm(c.title+' '+c.aliases.join(' ')),b=norm(c.summary+' '+c.claims.map(x=>x.text+' '+x.evidence.quote).join(' '));let v=words.reduce((s,w)=>s+(t.includes(w)?5:b.includes(w)?1:0),0);v+=c.aliases.filter(a=>a.length>5&&norm(q).includes(norm(a))).length*20;return v?v+(c.kind==='curated'?4:0):0}
$('metrics').innerHTML=[[data.metrics.sources,'fontes examinadas'],[data.metrics.curated_cards,'fichas estruturadas'],[data.metrics.candidate_cards,'grupos para revisar'],[data.metrics.verified_quotes,'citações conferidas']].map(([n,l])=>`<div><b>${Number(n||0).toLocaleString('pt-BR')}</b><span>${l}</span></div>`).join('');
function render(){let q=$('q').value.trim();let rows=cards.filter(c=>(!$('module').value||c.module===$('module').value)&&(!$('kind').value||c.kind===$('kind').value)&&(!$('status').value||c.status===$('status').value)).map(c=>({c,s:q?score(c,q):1})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.c.key.localeCompare(b.c.key));$('count').textContent=rows.length+' resultados · Dados locais de '+new Date(data.metrics.generated_at).toLocaleString('pt-BR')+' · Conteúdo interno';$('list').innerHTML='';for(const {c} of rows){const b=document.createElement('button');b.className='item'+(selected===c.key?' active':'');b.innerHTML=`<span class="tag">${esc(c.module)}</span><span class="tag ${esc(c.status)}">${esc(labels[c.status])}</span><strong>${esc(c.title)}</strong><span class="muted">${c.source_count} fonte(s) · ${c.kind==='curated'?'Síntese com citações':'Agrupamento automático'}</span>`;b.onclick=()=>{selected=c.key;render();show(c)};$('list').append(b)}if(!rows.some(x=>x.c.key===selected)){selected=rows[0]?.c.key;rows.length?show(rows[0].c):$('detail').innerHTML='<p class="empty">Nenhuma ficha encontrada. Experimente o nome da tabela, o código do erro ou inclua os agrupamentos.</p>'}}
function show(c){$('detail').innerHTML=`<span class="tag ${esc(c.status)}">${esc(labels[c.status])}</span><span class="tag">${esc(c.kind==='curated'?'Revisão técnica pendente ou registrada':'Agrupamento não equivale a diagnóstico')}</span><h2>${esc(c.title)}</h2><p class="summary">${esc(c.summary)}</p><div>${c.aliases.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div><h3>Afirmações e evidências</h3>${c.claims.map(x=>`<section class="claim"><small class="muted">${esc(fields[x.field]||x.field)}</small><p>${esc(x.text)}</p><details><summary>${esc(x.evidence.source)} · ${esc(x.evidence.segment)} — ver trecho</summary><blockquote>${esc(x.evidence.quote)}</blockquote><a href="${esc(x.evidence.url)}" target="_blank" rel="noopener noreferrer">Abrir fonte no Help Desk</a><p class="muted">${esc(x.evidence.title)}<br>Data da fonte: ${esc(x.evidence.source_date)}<br>SHA-256: <code>${esc(x.evidence.source_hash)}</code></p></details></section>`).join('')}<h3>Limites de aplicação</h3><ul class="limit">${c.limitations.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><p class="muted">Sinais de revisão: ${esc(c.flags.join(', ')||'Nenhum sinal automático; revisão ainda necessária.')}</p><div id="related"></div><h3>Revisão rastreável</h3><p class="muted">Esta página é uma fotografia pesquisável do banco. Para registrar uma decisão, use o comando de revisão descrito em scripts/CURATION.md. A aprovação é vinculada a esta revisão; alteração de evidência exige nova avaliação.</p><p class="muted">Ficha: <code>${esc(c.key)}</code><br>Revisão: <code>${esc(c.revision)}</code></p>`;for(const key of c.related){let other=cards.find(x=>x.key===key);if(other){let b=document.createElement('button');b.className='related';b.textContent=other.title;b.onclick=()=>{$('q').value='';$('module').value='';$('kind').value='curated';$('status').value='';selected=key;render();show(other)};$('related').append(b)}}}
for(const id of ['q','module','kind','status'])$(id).addEventListener(id==='q'?'input':'change',render);render();
</script></html>
