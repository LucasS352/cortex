<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07182d">
  <title>Alterar Senha · Cortex</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(ellipse at top, #0f2444, #071222 70%);
      color: #f1f5f9;
    }
    main {
      width: min(100%, 420px); padding: 32px;
      background: #0d1b2e; border: 1px solid #1f3756;
      border-radius: 20px; box-shadow: 0 24px 80px rgba(0,0,0,0.55);
    }
    .brand {
      display: flex; justify-content: center; margin-bottom: 24px;
    }
    .brand img {
      max-width: 200px; height: auto; border-radius: 8px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.5px; text-align: center; }
    p.subtitle { color: #94a8c2; line-height: 1.5; margin: 0 0 24px; font-size: 13px; text-align: center; }
    label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 600; color: #cbd7e6; }
    input {
      width: 100%; min-height: 46px; padding: 10px 14px;
      border: 1px solid #334d6e; border-radius: 9px;
      background: #081321; color: #fff; font: inherit; font-size: 14px;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
    button.submit-btn {
      width: 100%; min-height: 48px; margin-top: 24px; padding: 12px;
      border: 0; border-radius: 9px; background: #2563eb; color: #fff;
      font: inherit; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    button.submit-btn:hover { background: #3b82f6; }
    button.submit-btn:disabled { opacity: .6; cursor: not-allowed; }
    .nav-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 20px; font-size: 12px;
    }
    .nav-actions a { color: #60a5fa; text-decoration: none; }
    .nav-actions a:hover { text-decoration: underline; }
    .msg {
      margin: 16px 0 0; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5;
    }
    .msg-error { background: #482329; border: 1px solid #a84252; color: #ffd6dc; }
    .msg-success { background: #133a28; border: 1px solid #238656; color: #d1fae5; }
    footer {
      margin-top: 26px; padding-top: 18px; border-top: 1px solid #1e334d;
      color: #7b90a8; font-size: 11px; text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/tech-assets/cortex-logo-header.png" alt="Cortex Business Intelligence">
    </div>
    <h1>Alterar Senha</h1>
    <p class="subtitle">Defina uma nova senha para acessar sua conta no Cortex.</p>

    <div id="msg-box" class="msg" hidden role="alert"></div>

    <form id="password-form">
      <label for="curr-pass">Senha atual</label>
      <input id="curr-pass" type="password" name="current_password" autocomplete="current-password" required autofocus>

      <label for="new-pass">Nova senha</label>
      <input id="new-pass" type="password" name="new_password" minlength="8" maxlength="1024" autocomplete="new-password" required>

      <label for="conf-pass">Confirmar nova senha</label>
      <input id="conf-pass" type="password" name="confirm_password" minlength="8" maxlength="1024" autocomplete="new-password" required>

      <button type="submit" id="btn-submit" class="submit-btn">Salvar nova senha</button>
    </form>

    <div class="nav-actions">
      <a href="/admin">← Voltar ao painel</a>
      <a href="/logout">Sair da conta</a>
    </div>

    <footer>Alternativa Sistemas · Central de Inteligência</footer>
  </main>

  <script>
    const form = document.getElementById('password-form');
    const msgBox = document.getElementById('msg-box');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.hidden = true;
      msgBox.className = 'msg';

      const current = document.getElementById('curr-pass').value;
      const newPass = document.getElementById('new-pass').value;
      const confirmPass = document.getElementById('conf-pass').value;

      if (newPass.length < 8) {
        showMsg('A nova senha deve ter no mínimo 8 caracteres.', 'error');
        return;
      }
      if (newPass !== confirmPass) {
        showMsg('A confirmação não confere com a nova senha.', 'error');
        return;
      }
      if (current === newPass) {
        showMsg('Escolha uma senha diferente da senha atual.', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Alterando senha…';

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password: current, new_password: newPass })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.detail || data.error || 'Não foi possível alterar a senha.');
        }
        showMsg('Senha alterada com sucesso! Redirecionando para o login…', 'success');
        setTimeout(() => {
          window.location.href = data.redirect || '/login';
        }, 1200);
      } catch (err) {
        showMsg(err.message, 'error');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Salvar nova senha';
      }
    });

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = 'msg msg-' + type;
      msgBox.hidden = false;
    }
  </script>
</body>
</html>
