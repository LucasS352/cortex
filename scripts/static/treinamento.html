<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORTEX — Treinamento da IA</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --brand:#1f5eff;
          --ok:#12b76a; --warn:#f79009; --bad:#d92d20; --soft:#eef3ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; background:#101828; color:#fff; }
  header h1 { font-size:17px; margin:0; font-weight:600; } header small { color:#98a2b3; }
  header .grow { flex:1; }
  header input { width:150px; padding:8px 10px; border-radius:6px; border:0; }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 12px; border-radius:6px; font:inherit; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.danger { color:var(--bad); border-color:#fecdca; }
  button:disabled { opacity:.5; cursor:wait; }
  .layout { display:grid; grid-template-columns:270px 1fr; min-height:calc(100vh - 58px); }
  aside { background:var(--card); border-right:1px solid var(--line); padding:14px; overflow:auto; }
  aside .mod { padding:8px 10px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; }
  aside .mod:hover, aside .mod.active { background:var(--soft); }
  aside .sub { padding:4px 10px 4px 26px; font-size:13px; color:var(--muted); cursor:pointer; display:flex; justify-content:space-between; }
  aside .sub.active { color:var(--brand); font-weight:600; }
  .pill { font-size:11px; padding:1px 7px; border-radius:10px; background:#f2f4f7; color:var(--muted); white-space:nowrap; }
  .pill.warn { background:#fef0c7; color:#93370d; } .pill.bad { background:#fee4e2; color:#912018; }
  .pill.ok { background:#d1fadf; color:#05603a; } .pill.info { background:var(--soft); color:var(--brand); }
  main { padding:20px 24px; overflow:auto; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:9px 14px; color:var(--muted); }
  .tabs button.active { border-color:var(--brand); color:var(--ink); font-weight:600; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px;
         display:flex; gap:12px; align-items:center; }
  .row .grow { flex:1; min-width:0; } .row .title { font-weight:600; }
  .row .meta { color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .score { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-weight:700; flex:none; }
  .empty { color:var(--muted); padding:30px; text-align:center; background:var(--card); border:1px dashed var(--line); border-radius:10px; }
  dialog { width:min(1100px,96vw); border:0; border-radius:12px; padding:0; box-shadow:0 20px 60px #0004; }
  dialog::backdrop { background:#10182899; }
  .dlg-head { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .dlg-head h2 { font-size:16px; margin:0; flex:1; }
  .dlg-body { display:grid; grid-template-columns:1.5fr 1fr; gap:18px; padding:18px 20px; max-height:72vh; overflow:auto; }
  .dlg-foot { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=number], input[type=file], textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  textarea { min-height:70px; resize:vertical; } textarea.tall { min-height:160px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .panel { background:#f9fafb; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  .panel h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  .check { display:flex; gap:6px; font-size:13px; margin:3px 0; }
  .rel { border-left:3px solid var(--line); padding:4px 8px; margin:6px 0; font-size:13px; }
  .rel.conflict { border-color:var(--bad); } .rel.duplicate { border-color:var(--ok); } .rel.revision { border-color:var(--warn); }
  .toast { position:fixed; right:20px; bottom:20px; background:#101828; color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:420px; }
  pre { white-space:pre-wrap; font:inherit; margin:0; }
</style>
</head>
<body>
<header>
  <div><h1>CORTEX · Treinamento da IA</h1><small>Somente conhecimento aprovado por humanos alimenta as respostas oficiais</small></div>
  <div class="grow"></div>
  <input id="ticketInput" type="text" inputmode="numeric" placeholder="Nº do ticket">
  <button id="reviewAnswerBtn">Avaliar resposta</button><button id="modulesBtn">Gerenciar módulos</button>
  <button class="primary" id="transformBtn">Transformar em conhecimento</button>
</header>
<div class="layout">
  <aside id="tree"></aside>
  <main>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button data-tab="queue" class="active">Fila de curadoria</button>
      <button data-tab="reviews">Avaliações dos técnicos</button>
      <button data-tab="suggestions">Tickets sugeridos</button>
      <button data-tab="items">Base canônica</button>
      <button data-tab="releases">Versões do Master</button>
      <button data-tab="deprecated">Inativos</button>
    </div>
    <div id="toolbar" style="margin-bottom:10px"></div>
    <div id="list"></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
// Backward compatibility for review links already published in Movidesk.
// The embedded page stays in place; a standalone /treinamento URL is routed
// into the unified admin shell with the review context preserved.
if (window.top === window.self) {
  const current = new URLSearchParams(window.location.search);
  const target = new URL('/admin', window.location.origin);
  target.searchParams.set('view', 'training');
  for (const key of ['ticket', 'marker']) {
    if (current.get(key)) target.searchParams.set(key, current.get(key));
  }
  window.location.replace(target);
}
const API = '/api/treinamento';
const state = { tab: 'queue', module: null, subtopic: null, taxonomy: [], images: [], releases: [], q: '' };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modLabel = (k) => (state.taxonomy.find(m => m.key === k) || {}).label || k;
const subLabel = (m, s) => (((state.taxonomy.find(x => x.key === m) || {}).subtopics || []).find(x => x[0] === s) || [s, s])[1];
const fmt = (d) => d ? new Date(d).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '';
const REL = { conflict:['bad','Conflito'], duplicate:['ok','Mesmo procedimento'], revision:['warn','Complementa'], different_context:['info','Outro contexto'] };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 5000); }

async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: {'Content-Type':'application/json'}, ...opts,
                                        body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(typeof data.detail === 'string' ? data.detail : (data.detail?.message || 'Falha na operação'));
                 err.status = res.status; err.detail = data.detail; throw err; }
  return data;
}

async function loadOverview() {
  const o = await api('/overview');
  const t = o.totals;
  $('#stats').innerHTML = [['Procedimentos ativos', t.active], ['Aguardando revisão', t.pending], ['Conflitos abertos', t.conflicts],
    ['Inativados', t.deprecated], ['Sem vetor semântico', t.without_vector]]
    .map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#tree').innerHTML = `<div class="mod ${!state.module ? 'active' : ''}" data-m=""><span>Todos os módulos</span></div>` +
    o.modules.map(m => `
      <div class="mod ${state.module === m.key && !state.subtopic ? 'active' : ''}" data-m="${m.key}" title="${esc(m.description)}">
        <span>${esc(m.label)}</span>
        <span>${m.pending ? `<span class="pill warn">${m.pending} fila</span> ` : ''}<span class="pill">${m.items}</span></span></div>
      ${state.module === m.key ? m.subtopics.map(s => `
        <div class="sub ${state.subtopic === s.key ? 'active' : ''}" data-m="${m.key}" data-s="${s.key}"><span>${esc(s.label)}</span><span>${s.items}</span></div>`).join('') : ''}`).join('');
}

$('#tree').addEventListener('click', (e) => {
  const el = e.target.closest('[data-m]'); if (!el) return;
  state.module = el.dataset.m || null; state.subtopic = el.dataset.s || null;
  refresh();
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  state.tab = b.dataset.tab; refresh();
});

function scoreBadge(s) {
  const c = s >= 75 ? ['#d1fadf','#05603a'] : s >= 55 ? ['#fef0c7','#93370d'] : ['#fee4e2','#912018'];
  return `<div class="score" style="background:${c[0]};color:${c[1]}">${s}</div>`;
}

async function renderList() {
  const list = $('#list'); const m = state.module ? `module=${state.module}` : '';
  $('#toolbar').innerHTML = state.tab === 'releases'
    ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="color:var(--muted)">Registre peculiaridades, regressões e correções por versão. O texto aprovado passa a orientar a IA imediatamente.</span><button class="primary" onclick="openRelease()">Novo aviso de versão</button></div>`
    : (state.tab === 'items' || state.tab === 'deprecated')
    ? `<div style="display:flex;gap:8px"><input type="text" id="q" placeholder="Buscar por título, erro ou procedimento" value="${esc(state.q)}">
       ${state.tab === 'items' ? '' : ''}</div>` : '';
  const q = $('#q'); if (q) q.onkeydown = (e) => { if (e.key === 'Enter') { state.q = q.value; renderList(); } };
  list.innerHTML = '<div class="empty">Carregando…</div>';
  try {
    if (state.tab === 'queue') {
      const rows = await api(`/candidatos?${m}`);
      list.innerHTML = rows.length ? rows.map(r => {
        const ok = r.quality_checks.filter(c => c.ok).length;
        const rel = r.similar_items[0];
        return `<div class="row">${scoreBadge(r.usefulness_score)}
          <div class="grow"><div class="title">${esc(r.title)}</div>
          <div class="meta"><span>Ticket #${r.ticket_external_id}</span><span class="pill">${esc(modLabel(r.suggested_module))} › ${esc(subLabel(r.suggested_module, r.suggested_subtopic))}</span>
            ${r.status === 'conflict' ? '<span class="pill bad">Conflito com procedimento publicado</span>' : ''}
            ${rel && r.status !== 'conflict' ? `<span class="pill ${REL[rel.relation][0]}">${REL[rel.relation][1]}: ${esc(rel.title)}</span>` : ''}
            <span class="pill ${ok >= 5 ? 'ok' : 'warn'}">${ok}/${r.quality_checks.length} verificações</span>
            <span>${r.extractor === 'heuristic' ? 'Extração simplificada (IA indisponível)' : 'Extraído por IA'} · ${esc(r.created_by)} · ${fmt(r.created_at)}</span></div></div>
          <button class="primary" onclick="openCandidate(${r.id})">Revisar</button></div>`;
      }).join('') : '<div class="empty">Nenhuma sugestão aguardando revisão. Use "Transformar em conhecimento" ou a aba Tickets sugeridos.</div>';
    } else if (state.tab === 'reviews') {
      const reviews = await api('/avaliacoes');
      const rows = reviews.filter(r => !state.module || r.module_key === state.module);
      list.innerHTML = rows.map(r => `<div class="row"><div class="grow"><div class="title">${r.rating > 0 ? 'Boa resposta' : 'Precisa melhorar'} · #${r.ticket_external_id} · ação ${esc(r.action_id)}</div><div class="meta">${esc(modLabel(r.module_key))} · ${esc(r.actor)} · ${fmt(r.updated_at)}${r.example_ticket_external_id ? ` · exemplo #${r.example_ticket_external_id}` : ''}</div><p>${esc(r.comment)}</p></div>${r.candidate_id ? `<button onclick="openCandidate(${r.candidate_id})">Ver revisão</button>` : ''}</div>`).join('') || '<div class="empty">Nenhuma avaliação neste filtro.</div>';
    } else if (state.tab === 'suggestions') {
      const rows = await api(`/sugestoes?${m}`);
      list.innerHTML = rows.length ? rows.map(r => `<div class="row">${scoreBadge(r.score)}
          <div class="grow"><div class="title">#${r.ticket_external_id} · ${esc(r.subject)}</div>
          <div class="meta"><span class="pill">${esc(modLabel(r.module_key))}</span>
            ${r.signals.map(s => `<span class="pill ${s.weight > 0 ? 'ok' : 'bad'}">${s.weight > 0 ? '+' : ''}${s.weight} ${esc(s.label)}</span>`).join('')}</div></div>
          <button onclick="transform(${r.ticket_external_id}, false, this)">Analisar</button></div>`).join('')
        : '<div class="empty">Nenhum ticket resolvido elegível no momento.</div>';
    } else if (state.tab === 'releases') {
      const rows = await api('/versoes-master');
      state.releases = rows;
      const labels = {active:'Problema ativo',monitoring:'Em monitoramento',fixed:'Corrigido',inactive:'Inativo'};
      list.innerHTML = rows.length ? rows.map(r => `<div class="row">
        <div class="grow"><div class="title">Master ${esc(r.version_label)} · ${esc(r.title)}</div>
        <div class="meta"><span class="pill ${r.status === 'active' ? 'bad' : r.status === 'fixed' ? 'ok' : 'warn'}">${labels[r.status]}</span>
          ${(r.modules || []).map(m => `<span class="pill info">${esc(modLabel(m))}</span>`).join('')}
          <span>${(r.evidence || []).length} evidência(s)</span><span>aprovado por ${esc(r.approved_by)} · ${fmt(r.updated_at)}</span></div>
        <p>${esc(r.narrative)}</p>${r.workaround ? `<p><b>Orientação:</b> ${esc(r.workaround)}</p>` : ''}</div>
        <button onclick="openReleaseById(${Number(r.id)})">Editar</button></div>`).join('')
        : '<div class="empty">Nenhuma peculiaridade de versão cadastrada.</div>';
    } else {
      const params = new URLSearchParams({ status: state.tab === 'items' ? 'active' : 'deprecated' });
      if (state.module) params.set('module', state.module); if (state.subtopic) params.set('subtopic', state.subtopic);
      if (state.q) params.set('q', state.q);
      const rows = await api(`/itens?${params}`);
      list.innerHTML = rows.length ? rows.map(r => `<div class="row">
          <div class="grow"><div class="title">${esc(r.title)}</div>
          <div class="meta"><span class="pill">${esc(modLabel(r.module_key))} › ${esc(subLabel(r.module_key, r.subtopic_key))}</span>
            <span>v${r.version_no}</span><span>${r.sources} ticket(s) de evidência</span>
            ${Object.entries(r.applicability || {}).map(([k, v]) => `<span class="pill info">${esc(k)}: ${esc([].concat(v).join(', '))}</span>`).join('')}
            ${r.open_conflicts ? `<span class="pill bad">${r.open_conflicts} conflito(s)</span>` : ''}
            ${r.embedding_ok === false ? '<span class="pill warn">sem vetor (busca só textual)</span>' : ''}
            ${r.feedback ? `<span class="pill ${r.feedback > 0 ? 'ok' : 'bad'}">feedback ${r.feedback > 0 ? '+' : ''}${r.feedback}</span>` : ''}
            <span>atualizado ${fmt(r.updated_at)}</span></div></div>
          <button onclick="openItem(${r.id})">Abrir</button></div>`).join('')
        : '<div class="empty">Nenhum procedimento neste filtro.</div>';
    }
  } catch (e) { list.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function releaseEvidenceText(items) {
  return (items || []).map(e => `${e.kind}:${e.value}${e.label ? ' | ' + e.label : ''}`).join('\n');
}
function openReleaseById(id) { openRelease(state.releases.find(r => Number(r.id) === Number(id)) || {}); }
function openRelease(r = {}) {
  const dlg = $('#dlg'); const selected = new Set(r.modules || []);
  dlg.innerHTML = `<div class="dlg-head"><h2>${r.id ? 'Editar' : 'Novo'} aviso de versão do Master</h2><button id="closeRelease">Fechar</button></div>
    <div class="dlg-body" style="grid-template-columns:1fr 1fr"><div>
      <div class="grid2"><div><label>Versão do Master</label><input type="text" id="relVersion" placeholder="Ex.: 16/08/2026" value="${esc(r.version_label)}"></div>
      <div><label>Situação</label><select id="relStatus"><option value="active">Problema ativo</option><option value="monitoring">Em monitoramento</option><option value="fixed">Corrigido</option><option value="inactive">Inativo</option></select></div></div>
      <label>Título curto</label><input type="text" id="relTitle" placeholder="Ex.: Falha ao importar pedidos da Shopee" value="${esc(r.title)}">
      <label>Explique em linguagem natural o que acontece</label><textarea id="relNarrative" class="tall" placeholder="Na versão 16/08/2026, ao fazer..., o Master apresenta...">${esc(r.narrative)}</textarea>
      <label>Impacto para o cliente</label><textarea id="relImpact" placeholder="Quem é afetado e o que deixa de funcionar">${esc(r.impact)}</textarea>
      <label>Solução temporária ou definitiva</label><textarea id="relWorkaround" class="tall" placeholder="1. Confirme a versão...&#10;2. Acesse...&#10;3. Valide...">${esc(r.workaround)}</textarea>
    </div><div>
      <div class="panel"><h3>Módulos afetados</h3>${state.taxonomy.filter(m => m.key !== 'unclassified').map(m => `<label class="check"><input type="checkbox" name="relModule" value="${esc(m.key)}" ${selected.has(m.key) ? 'checked' : ''}> ${esc(m.label)}</label>`).join('')}</div>
      <label>Mensagens de erro (uma por linha)</label><textarea id="relErrors">${esc((r.error_messages || []).join('\n'))}</textarea>
      <label>Evidências (uma por linha)</label><textarea id="relEvidence" class="tall" placeholder="ticket:131726 | Caso confirmado&#10;url:https://... | Documento oficial&#10;note:Validado em homologação">${esc(releaseEvidenceText(r.evidence))}</textarea>
      <p style="color:var(--muted)">Use <b>ticket:</b>, <b>url:</b> ou <b>note:</b>. As evidências ficam vinculadas ao aviso e aparecem na auditoria.</p>
      <div class="panel"><h3>Como a IA utilizará</h3><p>O aviso será pesquisável por versão, erro, módulo e descrição. A IA deverá confirmar a versão do cliente antes de aplicar a orientação.</p></div>
    </div></div><div class="dlg-foot"><button class="primary" id="saveRelease">Salvar e disponibilizar para a IA</button></div>`;
  $('#relStatus').value = r.status || 'active'; $('#closeRelease').onclick = () => dlg.close();
  $('#saveRelease').onclick = async () => {
    const evidence = $('#relEvidence').value.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
      const match = line.match(/^(ticket|url|note):([^|]+)(?:\|\s*(.*))?$/i);
      return match ? {kind:match[1].toLowerCase(),value:match[2].trim(),label:(match[3] || '').trim()} : {kind:'note',value:line,label:''};
    });
    const body = {version_label:$('#relVersion').value.trim(),title:$('#relTitle').value.trim(),narrative:$('#relNarrative').value.trim(),
      impact:$('#relImpact').value.trim() || null,workaround:$('#relWorkaround').value.trim() || null,status:$('#relStatus').value,
      modules:[...document.querySelectorAll('input[name="relModule"]:checked')].map(x => x.value),
      error_messages:$('#relErrors').value.split('\n').map(x => x.trim()).filter(Boolean),evidence};
    $('#saveRelease').disabled = true;
    try { await api('/versoes-master' + (r.id ? `/${r.id}` : ''), {method:r.id ? 'PUT' : 'POST',body}); dlg.close(); await refresh(); toast('Aviso de versão aprovado e disponibilizado para a IA.'); }
    catch(e) { toast(e.message); $('#saveRelease').disabled = false; }
  };
  dlg.showModal();
}

async function transform(ticket, force = false, btn = null) {
  if (btn) btn.disabled = true;
  try {
    const c = await api('/candidatos', { method: 'POST', body: { ticket_external_id: ticket, force } });
    toast(`Ticket #${ticket} analisado.`); await refresh(); openCandidate(c.id);
  } catch (e) {
    if (e.status === 409 && e.detail?.signals) {
      const why = e.detail.signals.map(s => `${s.weight > 0 ? '+' : ''}${s.weight} ${s.label}`).join('\n');
      if (confirm(`${e.message}\n\n${why}\n\nAnalisar mesmo assim?`)) return transform(ticket, true, btn);
    } else toast(e.message);
  } finally { if (btn) btn.disabled = false; }
}
$('#transformBtn').onclick = () => {
  const n = parseInt($('#ticketInput').value, 10);
  if (!n) return toast('Informe o número do ticket.');
  transform(n, false, $('#transformBtn'));
};

function moduleOptions(sel) { return state.taxonomy.map(m => `<option value="${m.key}" ${m.key === sel ? 'selected' : ''}>${esc(m.label)}</option>`).join(''); }
function subOptions(mod, sel) { return ((state.taxonomy.find(m => m.key === mod) || {}).subtopics || []).map(([k, l]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(l)}</option>`).join(''); }

function contentForm(c) {
  const a = c.applicability || {};
  const ownUploads = new Set((c.images || []).map(x => x.file));
  const availableImages = state.images.filter(image => !/^[0-9a-f]{32}\.png$/.test(image.file) || ownUploads.has(image.file));
  return `
    <label>Título do procedimento</label><input type="text" id="f_title" value="${esc(c.title)}">
    <div class="grid2"><div><label>Módulo</label><select id="f_module">${moduleOptions(c.module_key)}</select></div>
      <div><label>Subtópico</label><select id="f_sub">${subOptions(c.module_key, c.subtopic_key)}</select></div></div>
    <label>Sintoma (como o cliente percebe)</label><textarea id="f_symptom">${esc(c.symptom)}</textarea>

function readForm() {

    symptom: $('#f_symptom').value.trim(), error_messages: list('#f_errors', '\n'), root_cause: $('#f_cause').value.trim(),
    customer_answer: $('#f_answer').value.trim() || null, procedure: $('#f_proc').value.trim(), prerequisites: $('#f_pre').value.trim() || null, expected_result: $('#f_exp').value.trim() || null,

}

  const content = { ...x, module_key: c.suggested_module, subtopic_key: c.suggested_subtopic };

      ${c.status === 'conflict' ? '<span class="pill bad">Conflito</span>' : '<span class="pill warn">Aguardando revisão</span>'}

        <div class="panel"><h3>Verificação de qualidade</h3>${c.quality_checks.map(q => `<div class="check">${q.ok ? '✅' : '⚠️'} ${esc(q.label)}</div>`).join('')}</div>
        <div class="panel"><h3>Evidências citadas do ticket</h3>
          ${Object.entries(x.evidence || {}).filter(([, v]) => v).map(([k, v]) => `<label>${({root_cause_quote:'Causa',procedure_quote:'Procedimento',confirmation_quote:'Confirmação'})[k]}</label><pre>“${esc(v)}”</pre>`).join('') || '<span class="pill warn">O extrator não citou trechos — revise com atenção.</span>'}</div>
        <div class="panel"><h3>Procedimentos relacionados na base</h3>
          ${related.length ? related.map(r => `<div class="rel ${r.relation}"><b>${REL[r.relation][1]}</b> · <a href="#" onclick="openItem(${r.item_id});return false">${esc(r.title)}</a> (v${r.version_no})<br><small>${esc(r.reasons.join('; '))}</small></div>`).join('') : 'Nenhum procedimento semelhante — será um conhecimento novo.'}</div>
        <div class="panel"><h3>Por que este ticket foi considerado útil</h3>
          ${c.usefulness_signals.map(s => `<div class="check">${s.weight > 0 ? '➕' : '➖'} ${esc(s.label)} (${s.weight > 0 ? '+' : ''}${s.weight})</div>`).join('')}
          <b>Pontuação: ${c.usefulness_score}/100</b></div>
        <a href="${'https://helpdesk.alternativasistemas.com.br/Ticket/Edit/' + c.ticket_external_id}" target="_blank" rel="noopener">Abrir ticket no Movidesk ↗</a>
      </div></div>
    <div class="dlg-foot">
      <input type="text" id="reason" placeholder="Motivo da decisão (obrigatório, fica na auditoria)" style="flex:1;min-width:260px">
      <select id="target" style="width:auto"><option value="">— procedimento existente —</option>
        ${related.map(r => `<option value="${r.item_id}">${esc(r.title)} (${REL[r.relation][1]})</option>`).join('')}</select>
      <button class="danger" data-act="reject">Rejeitar</button>

      <button class="primary" data-act="new">Publicar como novo</button>
    </div>`;

    const reason = $('#reason').value.trim(); const act = b.dataset.act; const target = parseInt($('#target').value, 10) || null;

  });
}

      </div></div>
    ${it.status === 'active' ? `<div class="dlg-foot">

async function rate(id, r) { try { await api(`/itens/${id}/feedback`, { method: 'POST', body: { rating: r } }); toast('Avaliação registrada.'); } catch (e) { toast(e.message); } }
async function conflict(cid, dismiss, item) {

async function reviewTicket(ticket, marker = '') {
  try {
    const data = await api(`/tickets/${ticket}/respostas`);
    if (!data.answers.length) return toast('Nenhuma resposta Cortex no histórico sincronizado deste ticket. Atualize a sincronização e tente novamente.');
    if (marker && !data.answers.some(a => a.text.includes(marker))) return toast('Esta resposta ainda não está no histórico sincronizado. Sincronize o ticket antes de avaliar.');
    const selected = data.answers.find(a => marker && a.text.includes(marker)) || data.answers[data.answers.length - 1];
    dlg.innerHTML = `<div class="dlg-head"><h2>Preparar conhecimento · Ticket #${ticket}</h2><button id="closeReview">Fechar</button></div>
      <div style="padding:20px;max-height:75vh;overflow:auto"><p><b>Responsabilidade do técnico:</b> registrar abaixo a resolução correta e completa. O conteúdo será enviado para a fila e só entrará na IA depois da aprovação administrativa.</p>
      <label>Resposta do Cortex que originou a revisão</label><select id="answerSelect">${data.answers.map(a => `<option value="${esc(a.action_id)}" ${a === selected ? 'selected' : ''}>Ação ${esc(a.action_id)} · ${esc(a.created_at || '')}</option>`).join('')}</select>
      <pre id="answerPreview" class="panel"></pre>
      <div class="panel" style="border:2px solid #2563eb"><h3>Conteúdo preparado pelo técnico</h3>
        <label>Pergunta do cliente relacionada</label><select id="ticketQuestionSelect">${(data.questions || []).map(q => `<option value="${esc(q.action_id)}">Nota ${esc(q.action_id)} · ${esc(q.created_at || '')} · ${esc(q.text.slice(0,120))}</option>`).join('')}</select>
        <label>Módulo obrigatório</label><select id="answerModule"><option value="">Selecione</option>${moduleOptions('').replace(/<option value="unclassified"[^>]*>.*?<\/option>/g,'')}</select>
        <label>Título curto do conhecimento</label><input id="proposalTitle" type="text" value="${esc(data.subject || '')}" placeholder="Ex.: Consultar produtos por fornecedor">
        <label>Resposta final para o cliente</label><textarea id="proposalAnswer" class="tall" placeholder="Ex.: Sim, o relatório está disponível no Master..."></textarea>
        <label>Passo a passo da resolução <small>— um passo por linha, começando por 1.</small></label><textarea id="proposalProcedure" class="tall" placeholder="1. Acesse Relatórios > Vendas > Histórico.&#10;2. Abra Produtos por Fabricante/Fornecedor.&#10;3. Selecione a aba Fornecedor."></textarea>
        <label>Prints (PNG, JPEG ou WebP; até 5 arquivos e 5 MB cada)</label><input id="proposalFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple>
        <div id="proposalImageList"></div>
        <label>Observação para os administradores <small>— opcional</small></label><textarea id="answerComment" placeholder="Ex.: caminho validado na versão atual do Master"></textarea>
        <details style="margin-top:12px"><summary>Copiar uma resposta já registrada em outro ticket (opcional)</summary>
          <label>Ticket usado como evidência</label><div style="display:flex;gap:8px"><input id="exampleTicket" type="number" min="1" step="1" value="${ticket}"><button id="loadExampleAnswer" type="button">Carregar notas do ticket</button></div>
          <div id="exampleAnswerBox" style="display:none"><label>Nota da pergunta do cliente</label><select id="exampleQuestionSelect"></select><label>Nota da resposta humana</label><select id="exampleAnswerSelect"></select><button id="useExampleAnswer" type="button" style="margin-top:6px">Usar este par na proposta</button></div>

    };

    let proposalFiles = [];

      proposalFiles = [...e.target.files].slice(0, 5);
      if (e.target.files.length > 5) toast('Serão usados somente os 5 primeiros prints.');
      $('#proposalImageList').innerHTML = proposalFiles.map((file,i) => `<div class="grid2" style="margin-top:10px"><div><img src="${URL.createObjectURL(file)}" alt="Prévia" style="max-width:220px;max-height:120px"><small>${esc(file.name)}</small></div><div><label>Nome da imagem</label><input id="proposalName_${i}" value="${esc(file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '))}"><label>Onde exibir</label><select id="proposalPlace_${i}"><option value="answer">Após a resposta final</option><option value="procedure" selected>Após um passo</option></select><label>Número do passo</label><input id="proposalStep_${i}" type="number" min="1" max="100" value="${i+1}"><label>Legenda obrigatória</label><input id="proposalCaption_${i}" type="text" placeholder="O que este print demonstra"></div></div>`).join('');
    };
    let exampleQuestions = [], exampleAnswers = [];
    $('#exampleTicket').oninput = () => {
      exampleQuestions = []; exampleAnswers = []; $('#exampleAnswerBox').style.display = 'none';
    };
    const selectSuggestedQuestion = () => {
      const answer = exampleAnswers[Number($('#exampleAnswerSelect').value)];
      if (answer?.suggested_question_action_id && exampleQuestions.some(q => q.action_id === answer.suggested_question_action_id))
        $('#exampleQuestionSelect').value = answer.suggested_question_action_id;
    };
    $('#loadExampleAnswer').onclick = async () => {
      const exampleTicket = Number($('#exampleTicket').value);
      if (!Number.isInteger(exampleTicket) || exampleTicket <= 0) return toast('Informe um ticket válido.');
      $('#loadExampleAnswer').disabled = true;
      try {
        const source = await api(`/tickets/${exampleTicket}/respostas-tecnicas`);
        exampleQuestions = source.questions || [];
        exampleAnswers = source.answers || [];
        if (!exampleQuestions.length || !exampleAnswers.length) return toast('Não encontrei um par de pergunta do cliente e resposta humana nesse ticket sincronizado.');
        $('#proposalTitle').value ||= source.subject || '';
        $('#exampleQuestionSelect').innerHTML = exampleQuestions.map(q => `<option value="${esc(q.action_id)}">Nota ${esc(q.action_id)} · ${esc(q.created_at || '')} · ${esc(q.text.slice(0,90))}</option>`).join('');
        $('#exampleAnswerSelect').innerHTML = exampleAnswers.map((a,i) => `<option value="${i}">Ação ${esc(a.action_id)} · ${esc(a.created_at || '')} · ${esc(a.text.slice(0,90))}</option>`).join('');
        $('#exampleAnswerBox').style.display = 'block';
        $('#exampleAnswerSelect').value = String(exampleAnswers.length - 1);
        selectSuggestedQuestion();
        toast('Confira o par sugerido. Você pode trocar a pergunta ou a resposta antes de copiar.');

      finally { $('#loadExampleAnswer').disabled = false; }
    };
    $('#exampleAnswerSelect').onchange = selectSuggestedQuestion;
    $('#useExampleAnswer').onclick = () => {
      const source = exampleAnswers[Number($('#exampleAnswerSelect').value)];

      if (!$('#answerModule').value) return toast('Selecione o módulo.');

      try {
        const proposedImages = await Promise.all(proposalFiles.map((file,i) => new Promise((resolve,reject) => {
          const reader = new FileReader(); reader.onerror = () => reject(new Error('Não foi possível ler um dos prints.'));
          reader.onload = () => { const placement=$(`#proposalPlace_${i}`).value; resolve({data_url:reader.result,name:$(`#proposalName_${i}`).value.trim(),placement,after_step:placement==='procedure'?Number($(`#proposalStep_${i}`).value):null,caption:$(`#proposalCaption_${i}`).value.trim()}); };
          reader.readAsDataURL(file);
        })));
        if (proposedImages.some(x => x.caption.length < 3)) throw new Error('Informe uma legenda para cada print.');
        const pairedAnswer = exampleAnswers[Number($('#exampleAnswerSelect').value)];
        const usingLoadedPair = !!pairedAnswer;
        const evidenceTicket = usingLoadedPair ? exampleTicket : ticket;
        const questionAction = usingLoadedPair ? $('#exampleQuestionSelect').value : $('#ticketQuestionSelect').value;
        const result = await api(`/tickets/${ticket}/avaliar`, {method:'POST',body:{action_id:$('#answerSelect').value,rating:-1,module_key:$('#answerModule').value,comment:$('#answerComment').value,example_ticket_id:evidenceTicket,proposed_title:title,proposed_answer:answer,proposed_procedure:procedure,proposed_images:proposedImages,question_action_id:questionAction,source_answer_action_id:usingLoadedPair ? pairedAnswer.action_id : null}});
        dlg.close(); await refresh();
        toast('Proposta enviada para a fila de curadoria. Ela ainda não foi publicada na IA.');
      } catch(e) { toast(e.message); }
      finally { if ($('#submitProposal')) $('#submitProposal').disabled = false; }
    };
    $('#submitProposal').onclick = submit;
  } catch(e) { toast(e.message); }
}
$('#reviewAnswerBtn').onclick = () => { const ticket = Number($('#ticketInput').value); if (Number.isInteger(ticket) && ticket > 0) reviewTicket(ticket); else toast('Informe o número do ticket.'); };
$('#modulesBtn').onclick = () => {
  dlg.innerHTML = `<div class="dlg-head"><h2>Gerenciar módulos</h2><button id="closeModules">Fechar</button></div><div style="padding:20px">
    <label>Módulo</label><select id="editModule"><option value="">Criar módulo</option>${moduleOptions('')}</select>
    <label>Chave permanente (não muda ao renomear)</label><input type="text" id="moduleKey" placeholder="exemplo: atendimento">
    <label>Nome exibido</label><input type="text" id="moduleLabel"><label>Descrição</label><input type="text" id="moduleDescription">
    <p>Renomear preserva a classificação e o histórico dos procedimentos.</p><button class="primary" id="saveModule">Salvar módulo</button></div>`;
  $('#closeModules').onclick = () => dlg.close();
  $('#editModule').onchange = e => { const m = state.taxonomy.find(m => m.key === e.target.value); $('#moduleKey').value = m?.key || ''; $('#moduleKey').disabled = !!m; $('#moduleLabel').value = m?.label || ''; $('#moduleDescription').value = m?.description || ''; };
  $('#saveModule').onclick = async () => { try { state.taxonomy = await api('/taxonomia',{method:'POST',body:{key:$('#moduleKey').value,label:$('#moduleLabel').value,description:$('#moduleDescription').value}}); dlg.close(); await refresh(); toast('Módulo salvo.'); } catch(e) { toast(e.message); } };
  dlg.showModal();
};
(async () => { state.taxonomy = await api('/taxonomia'); state.images = await api('/imagens'); await refresh(); const p = new URLSearchParams(location.search); const ticket = Number(p.get('ticket')); if (Number.isInteger(ticket) && ticket > 0) { $('#ticketInput').value = ticket; await reviewTicket(ticket,p.get('marker') || ''); } })();

</script>
