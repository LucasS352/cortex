<title>CORTEX — Treinamento da IA</title>
<script>
  if (window.top === window.self) {
    const params = new URLSearchParams(window.location.search);
    const ticket = params.get('ticket') || '';
    const marker = params.get('marker') || '';
    if (/^\d+$/.test(ticket)) {
      const target = new URL('/treinamento/tecnico', window.location.origin);
      target.searchParams.set('ticket', ticket);
      if (/^CORTEX-AI-NOTE:[a-f0-9]{64}$/i.test(marker)) target.searchParams.set('marker', marker);
      window.location.replace(target);
    } else {
      const target = new URL('/admin', window.location.origin);
      target.searchParams.set('view', 'training');
      window.location.replace(target);
    }
  }
  (function syncInitialTheme() {
    try {
      if (window.top !== window.self) {
        document.documentElement.classList.add('embedded-in-admin');
      }
      const parentTheme = window.parent && window.parent !== window
        ? window.parent.document.documentElement.dataset.theme
        : null;
      const savedTheme = localStorage.getItem('cortex-theme');
      const theme = (parentTheme === 'light' || parentTheme === 'dark')
        ? parentTheme
        : (savedTheme === 'light' ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
      if (window.parent && window.parent !== window && window.parent.document?.documentElement) {
        new MutationObserver(() => {
          const next = window.parent.document.documentElement.dataset.theme;
          if (next) document.documentElement.dataset.theme = next;
        }).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      }
    } catch (_) {}
  })();
</script>

  </div>
</header>
<div class="wrap">
  <aside id="tree"><h2>Módulos do Master</h2></aside>
  <main>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button data-tab="queue" class="tab active">Fila de curadoria</button>
      <button data-tab="reviews" class="tab">Avaliações dos técnicos</button>
      <button data-tab="suggestions" class="tab">Tickets sugeridos</button>
      <button data-tab="items" class="tab">Base canônica</button>
      <button data-tab="staging" class="tab">Importação em prévia</button>
      <button data-tab="metrics" class="tab">Qualidade do suporte</button>
      <button data-tab="releases" class="tab">Versões do Master</button>
      <button data-tab="deprecated" class="tab">Inativos</button>
    </div>
    <div id="toolbar"></div>
    <div id="list" class="card"></div>
  </main>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
const API = '/api/treinamento';
const state = { tab: 'queue', module: null, subtopic: null, expandedSubs: {}, q: '', taxonomy: [], overview: null, images: [], staging: [], releases: [] };
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (d) => d ? new Date(d).toLocaleString('pt-BR') : '—';
const REL = { duplicate: ['warn', 'Duplicado'], evolution: ['ok', 'Evolução'], different_context: ['ok', 'Outro contexto'], conflict: ['bad', 'Conflito'] };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 4200); }
async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(data.detail?.message || data.detail || 'Erro na operação'); err.status = r.status; err.detail = data.detail; throw err; }
  return data;
}

function modLabel(k) { return (state.taxonomy.find(m => m.key === k) || {}).label || k; }
function subLabel(m, s) { return (((state.taxonomy.find(x => x.key === m) || {}).subtopics || []).find(x => x[0] === s) || [])[1] || s; }
function scoreBadge(s) {
  const c = s >= 75 ? ['#d1fadf','#05603a'] : s >= 55 ? ['#fef0c7','#93370d'] : ['#fee4e2','#912018'];
  return `<div class="score" style="background:${c[0]};color:${c[1]}">${s}</div>`;
}

async function loadOverview() {
  const o = await api('/overview');
  state.overview = o;
  const t = o.totals || {};
  $('#stats').innerHTML = [
    ['Procedimentos ativos na IA', t.active || 0],
    ['Aguardando revisão', t.pending || 0],
    ['Conflitos abertos', t.conflicts || 0],
    ['Procedimentos inativados', t.deprecated || 0],
    ['Sem vetor semântico', t.without_vector || 0]
  ].map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');

  $('#tree').innerHTML = `<h2>Módulos do Master</h2><div class="mod ${!state.module ? 'active' : ''}" data-m=""><span>Todos os módulos</span><span class="pill">${t.active || 0}</span></div>` +
    (o.modules || []).map(m => {
      const isModOpen = state.module === m.key;
      const modActive = isModOpen && !state.subtopic ? 'active' : '';
      const modArrow = `<span class="tree-arrow">${isModOpen ? '▾' : '▸'}</span>`;
      const subtopicsHtml = isModOpen ? (m.subtopics || []).map(s => {
        const hasChildren = s.children && s.children.length > 0;
        const isSubExpanded = !!state.expandedSubs[s.key] || (state.subtopic && state.subtopic.startsWith(s.key + ':'));
        const isSubActive = state.subtopic === s.key;
        const subArrow = hasChildren ? `<span class="tree-arrow tree-arrow-sub">${isSubExpanded ? '▾' : '▸'}</span>` : '';
        const childrenHtml = (hasChildren && isSubExpanded) ? (s.children || []).map(c => {
          const isChildActive = state.subtopic === c.key;
          return `
            <div class="sub-sub ${isChildActive ? 'active' : ''}" data-m="${m.key}" data-s="${c.key}">
              <span>${esc(c.label)}</span><span class="pill">${c.items}</span>
            </div>`;
        }).join('') : '';

        return `
          <div class="sub ${isSubActive ? 'active' : ''}" data-m="${m.key}" data-s="${s.key}" ${hasChildren ? 'data-parent="1"' : ''}>
            <span style="display:flex;align-items:center;gap:5px">${subArrow}<span>${esc(s.label)}</span></span>
            <span class="pill">${s.items}</span>
          </div>
          ${childrenHtml}`;
      }).join('') : '';

      return `
        <div class="mod ${modActive}" data-m="${m.key}" title="${esc(m.description)}">
          <span style="display:flex;align-items:center;gap:6px">${modArrow}<span>${esc(m.label)}</span></span>
          <span>${m.pending ? `<span class="pill warn">${m.pending} fila</span> ` : ''}<span class="pill">${m.items}</span></span>
        </div>
        ${subtopicsHtml}`;
    }).join('');
}

$('#tree').addEventListener('click', (e) => {
  const el = e.target.closest('[data-m]'); if (!el) return;
  const m = el.dataset.m || null;
  const s = el.dataset.s || null;
  const isParent = el.dataset.parent === '1';

  if (!m) {
    state.module = null;
    state.subtopic = null;
    refresh();
    return;
  }

  if (!s) {
    if (state.module === m) {
      // Toggle accordion: collapse back inside the module
      state.module = null;
      state.subtopic = null;
    } else {
      state.module = m;
      state.subtopic = null;
    }
    refresh();
    return;
  }

  if (isParent) {
    const isExpanded = !!state.expandedSubs[s] || (state.subtopic && state.subtopic.startsWith(s + ':'));
    if (isExpanded && state.subtopic === s) {
      delete state.expandedSubs[s];
      state.subtopic = null;
    } else {
      state.expandedSubs[s] = true;
      state.subtopic = s;
    }
    refresh();
    return;
  }

  if (state.subtopic === s) {
    state.subtopic = s.includes(':') ? s.split(':')[0] : null;
  } else {
    state.subtopic = s;
  }
  refresh();
});

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  state.tab = b.dataset.tab;
  refresh();
});

async function renderList() {
  const list = $('#list'); const m = state.module ? `module=${encodeURIComponent(state.module)}` : '';
  $('#toolbar').innerHTML = state.tab === 'releases'
    ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span style="color:var(--muted)">Registre peculiaridades, regressões e correções por versão. O texto aprovado passa a orientar a IA imediatamente.</span><button class="primary" onclick="openRelease()">Novo aviso de versão</button></div>`
    : (state.tab === 'items' || state.tab === 'deprecated')
    ? `<div style="display:flex;gap:8px"><input type="search" id="q" placeholder="Buscar por título, erro ou procedimento…" value="${esc(state.q)}"></div>` : '';
  const q = $('#q');
  if (q) {
    q.onkeydown = (e) => { if (e.key === 'Enter') { state.q = q.value.trim(); renderList(); } };
    q.oninput = () => { clearTimeout(q._t); q._t = setTimeout(() => { state.q = q.value.trim(); renderList(); }, 350); };
  }
  list.innerHTML = '<div class="empty">Carregando…</div>';
  try {
    if (state.tab === 'staging') {
      const rows = await api('/staging'); state.staging = rows;
      list.innerHTML = rows.length ? rows.filter(r => !state.module || r.content.module_key === state.module).map(r =>
        `<div class="row"><div class="grow"><div class="title">${esc(r.content.title)}</div><div class="meta">${esc(r.card_id)} · Prévia aguardando aprovação administrativa</div></div><button class="primary" data-stage="${esc(r.id)}">Revisar importação</button></div>`).join('') : '<div class="empty">Nenhum pacote de importação disponível.</div>';
      list.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => openStaging(b.dataset.stage));
    } else if (state.tab === 'metrics') {
      const data = await api('/metricas-suporte');
      const table = (rows, headers, values) => rows.length ? `<table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr style="border-bottom:1px solid var(--line)">${headers.map(h=>`<th style="padding:8px 6px">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr style="border-bottom:1px solid var(--line)">${values(r).map(v=>`<td style="padding:8px 6px">${esc(v ?? '—')}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p class="muted">Sem registros neste período.</p>';
      const reviews = data.answer_reviews || {};
      const avgScoreText = reviews.average_score != null ? ` · Nota média (0–10): <b>${esc(reviews.average_score)}/10</b> (${reviews.scored_count || 0} com nota)` : '';
      list.innerHTML = `<div class="panel"><h3>Avaliações humanas</h3><p>${reviews.total || 0} avaliações · ${reviews.approved || 0} aprovadas · ${reviews.corrected ?? '—'} corrigidas · ${reviews.rejected || 0} rejeitadas${avgScoreText}</p></div>
        <div class="panel"><h3>Prazo médio até aprovação</h3><p>${data.approval_time?.mean_seconds == null ? 'Sem aprovações registradas' : Math.round(data.approval_time.mean_seconds/60)+' minutos'} · ${data.approval_time?.decided || 0} decisões</p></div>
        <div class="panel"><h3>Fontes anexadas no assistente</h3><p>${data.evidence_coverage?.assistant_messages || 0} respostas · ${data.evidence_coverage?.messages_without_attached_source || 0} sem fonte anexada</p></div>
        <div class="panel"><h3>Cobertura por módulo</h3>${table(data.module_coverage || [],['Módulo','Procedimentos ativos'],r=>[modLabel(r.module_key),r.active_procedures])}</div>
        <div class="panel"><h3>Procedimentos citados</h3>${table(data.procedure_citations || [],['Procedimento','Versão','Citações'],r=>[r.title,r.version,r.citations])}</div>
        <div class="panel"><h3>Versões com avaliações negativas</h3>${table(data.negative_procedures || [],['Procedimento','Versão','Avaliações negativas'],r=>[r.title,r.version_id,r.negative_reviews])}</div>
        <div class="panel"><h3>Recorrência no assistente</h3>${table(data.company_recurrence || [],['Empresa','Atendimentos'],r=>[r.movidesk_company_id,r.conversations])}</div>` +
        `<div class="panel"><h3>Decisões operacionais recentes</h3>${table(data.operational?.states || [],['Decisão','Ocorrências'],r=>[r.state,r.events])}</div>
        <div class="panel"><h3>Termos que exigiram investigação</h3>${table(data.operational?.investigation_terms || [],['Termo técnico','Ocorrências'],r=>[r.term,r.events])}</div>
        <div class="panel"><h3>Procedimentos usados nas notas e no assistente</h3>${table(data.operational?.procedures || [],['Fonte','Versão','Usos'],r=>[r.source_id,r.source_version,r.events])}</div>` +
        `<div class="panel"><h3>Limites destas métricas</h3>${(data.limitations || []).map(v => `<p class="muted">${esc(v)}</p>`).join('')}</div>`;
    } else if (state.tab === 'queue') {
      const qp = new URLSearchParams({ status: 'open' });
      if (state.module) qp.set('module', state.module);
      if (state.subtopic) qp.set('subtopic', state.subtopic);
      const rows = await api(`/candidatos?${qp}`);
      list.innerHTML = rows.length ? rows.map(r => {
        const ok = (r.quality_checks || []).filter(c => c.ok).length;
        const rel = (r.similar_items || [])[0];
        const st = r.status === 'conflict' ? '<span class="pill bad">Conflito com procedimento publicado</span>' :
                   r.status === 'needs_revision' ? '<span class="pill bad">Devolvido ao técnico</span>' :
                   r.status === 'pending' ? '<span class="pill warn">Pendente</span>' :
                   `<span class="pill ok">${esc(r.status)}</span>`;
        const pair = r.source_question_action_id
          ? ` · pergunta ${esc(r.source_question_action_id)} → ${r.source_answer_action_id ? 'resposta ' + esc(r.source_answer_action_id) : 'resposta redigida'}`
          : r.source_action_id ? ` · ação ${esc(r.source_action_id)}` : '';
        return `<div class="row">${scoreBadge(r.usefulness_score)}
          <div class="grow"><div class="meta">${st} <span class="pill">${esc(modLabel(r.suggested_module))} › ${esc(subLabel(r.suggested_module, r.suggested_subtopic))}</span>
            <span>Ticket #${r.ticket_external_id}${pair}</span>
            ${rel && r.status !== 'conflict' ? `<span class="pill ${REL[rel.relation][0]}">${REL[rel.relation][1]}: ${esc(rel.title)}</span>` : ''}
            <span class="pill ${ok >= 5 ? 'ok' : 'warn'}">${ok}/${(r.quality_checks || []).length} verificações</span>
            <span>${r.extractor === 'heuristic' ? 'Extração simplificada (IA indisponível)' : 'Extraído por IA'} · ${esc(r.created_by)} · ${fmt(r.created_at)}</span></div>
            <div class="title">${esc(r.title)}</div>
          </div>
          <button class="primary" onclick="openCandidate(${r.id})">Revisar</button>
        </div>`;
      }).join('') : '<div class="empty">Nenhuma sugestão aguardando revisão. Use "Transformar em conhecimento" ou a aba Tickets sugeridos.</div>';
    } else if (state.tab === 'reviews') {
      const reviews = await api('/avaliacoes');
      const rows = reviews.filter(r => !state.module || r.module_key === state.module);
      list.innerHTML = rows.map(r => {
        const scoreTag = r.score != null ? `<span class="pill ${r.score >= 7 ? 'ok' : r.score >= 4 ? 'warn' : 'bad'}">Nota ${r.score}/10</span> ` : '';
        const draftTag = r.is_draft ? '<span class="pill info">Rascunho</span> ' : '';
        return `<div class="row"><div class="grow"><div class="title">${r.rating > 0 ? 'Boa resposta' : 'Precisa melhorar'} · #${r.ticket_external_id} · ação ${esc(r.action_id)}</div><div class="meta">${scoreTag}${draftTag}${esc(modLabel(r.module_key))}${r.subtopic_key ? ' › ' + esc(subLabel(r.module_key, r.subtopic_key)) : ''} · ${esc(r.actor)} · ${fmt(r.updated_at)}${r.example_ticket_external_id ? ` · exemplo #${r.example_ticket_external_id}` : ''}${r.source_answer_action_id ? ` · nota importada #${esc(r.source_answer_action_id)}` : ''}</div><p style="margin:6px 0">${esc(r.comment)}</p></div>${r.candidate_id ? `<button onclick="openCandidate(${r.candidate_id})">Ver revisão</button>` : ''}</div>`;
      }).join('') || '<div class="empty">Nenhuma avaliação neste filtro.</div>';
    } else if (state.tab === 'suggestions') {
      const rows = await api(`/sugestoes?${m}`);
      list.innerHTML = rows.length ? rows.map(r => `<div class="row">${scoreBadge(r.score)}
          <div class="grow"><div class="title">#${r.ticket_external_id} · ${esc(r.subject)}</div>
          <div class="meta"><span class="pill">${esc(modLabel(r.module_key))}</span>
            ${r.signals.map(s => `<span class="pill ${s.weight > 0 ? 'ok' : 'bad'}">${s.weight > 0 ? '+' : ''}${s.weight} ${esc(s.label)}</span>`).join('')}</div></div>
          <button class="primary" onclick="transform(${r.ticket_external_id}, false, this)">Analisar</button></div>`).join('')
        : '<div class="empty">Nenhum ticket resolvido elegível no momento.</div>';
    } else if (state.tab === 'releases') {
      const rows = await api('/versoes-master');
      state.releases = rows;
      const labels = {active:'Problema ativo',monitoring:'Em monitoramento',fixed:'Corrigido',inactive:'Inativo'};
      list.innerHTML = rows.length ? rows.map(r => `<div class="row">
        <div class="grow"><div class="title">Master ${esc(r.version_label)} · ${esc(r.title)}</div>
        <div class="meta"><span class="pill ${r.status === 'active' ? 'bad' : r.status === 'fixed' ? 'ok' : 'warn'}">${labels[r.status] || r.status}</span>
          ${(r.modules || []).map(m => `<span class="pill info">${esc(modLabel(m))}</span>`).join('')}
          <span>${(r.evidence || []).length} evidência(s)</span><span>aprovado por ${esc(r.approved_by)} · ${fmt(r.updated_at)}</span></div>
        <p style="margin:6px 0">${esc(r.narrative)}</p>${r.workaround ? `<p style="margin:4px 0"><b>Orientação:</b> ${esc(r.workaround)}</p>` : ''}</div>
        <button onclick="openReleaseById(${Number(r.id)})">Editar</button></div>`).join('')
        : '<div class="empty">Nenhuma peculiaridade de versão cadastrada.</div>';
    } else {
      const params = new URLSearchParams({ status: state.tab === 'items' ? 'active' : 'deprecated' });
      if (state.module) params.set('module', state.module); if (state.subtopic) params.set('subtopic', state.subtopic);
      if (state.q) params.set('q', state.q);
      const rows = await api(`/itens?${params}`);
      list.innerHTML = rows.length ? rows.map(r => `<div class="row">
          <div class="grow"><div class="title">${esc(r.title)}</div>
          <div class="meta"><span class="pill">${esc(modLabel(r.module_key))} › ${esc(subLabel(r.module_key, r.subtopic_key))}</span>
            <span>v${r.version_no}</span><span>${r.sources} ticket(s) de evidência</span>
            ${r.open_conflicts ? `<span class="pill bad">${r.open_conflicts} conflito(s)</span>` : ''}
            <span>👍 ${r.feedback > 0 ? '+'+r.feedback : r.feedback}</span></div></div>
          <button onclick="openItem(${r.id})">Abrir</button></div>`).join('')
        : '<div class="empty">Nenhum procedimento canônico nesta listagem.</div>';
    }
  } catch(e) {
    list.innerHTML = `<div class="empty" style="color:var(--bad)">Falha ao carregar lista: ${esc(e.message)}</div>`;
  }
}

function releaseEvidenceText(evidence) {
  return (evidence || []).map(item => `${item.kind || 'note'}:${item.value || ''}${item.label ? ' | ' + item.label : ''}`).join('\n');
}

function openReleaseById(id) { openRelease(state.releases.find(r => Number(r.id) === Number(id)) || {}); }

function openRelease(r = {}) {
  const dlg = $('#dlg'); const selected = new Set(r.modules || []);
  dlg.innerHTML = `<div class="dlg-head"><div class="dlg-head-title"><span class="dlg-kicker">Avisos de Versão · ERP Master</span><h2>${r.id ? 'Editar' : 'Novo'} aviso de versão do Master</h2></div><div class="dlg-head-actions"><button id="closeRelease">Fechar</button></div></div>
    <div class="dlg-body" style="grid-template-columns:1fr 1fr"><div>
      <div class="form-section">
        <div class="form-section-head"><h3>Identificação da versão</h3><span>Contexto operacional</span></div>
        <div class="grid2"><div><label>Versão do Master</label><input type="text" id="relVersion" placeholder="Ex.: 16/08/2026" value="${esc(r.version_label)}"></div>
        <div><label>Situação</label><select id="relStatus"><option value="active">Problema ativo</option><option value="monitoring">Em monitoramento</option><option value="fixed">Corrigido</option><option value="inactive">Inativo</option></select></div></div>
        <label>Título curto</label><input type="text" id="relTitle" placeholder="Ex.: Falha ao importar pedidos da Shopee" value="${esc(r.title)}">
        <label>Explique em linguagem natural o que acontece</label><textarea id="relNarrative" class="tall" placeholder="Na versão 16/08/2026, ao fazer..., o Master apresenta...">${esc(r.narrative)}</textarea>
        <label>Impacto para o cliente</label><textarea id="relImpact" placeholder="Quem é afetado e o que deixa de funcionar">${esc(r.impact)}</textarea>
        <label>Solução temporária ou definitiva</label><textarea id="relWorkaround" class="tall" placeholder="1. Confirme a versão...&#10;2. Acesse...&#10;3. Valide...">${esc(r.workaround)}</textarea>
      </div>
    </div><div>
      <div class="panel"><h3>Módulos afetados</h3>${state.taxonomy.filter(m => m.key !== 'unclassified').map(m => `<label class="check"><input type="checkbox" name="relModule" value="${esc(m.key)}" ${selected.has(m.key) ? 'checked' : ''}> ${esc(m.label)}</label>`).join('')}</div>
      <div class="form-section">
        <div class="form-section-head"><h3>Assinaturas e Evidências</h3><span>Rastreabilidade</span></div>
        <label>Mensagens de erro (uma por linha)</label><textarea id="relErrors">${esc((r.error_messages || []).join('\n'))}</textarea>
        <label>Evidências (uma por linha)</label><textarea id="relEvidence" class="tall" placeholder="ticket:131726 | Caso confirmado&#10;url:https://... | Documento oficial&#10;note:Validado em homologação">${esc(releaseEvidenceText(r.evidence))}</textarea>
        <p style="color:var(--muted);font-size:12px">Use <b>ticket:</b>, <b>url:</b> ou <b>note:</b>. As evidências ficam vinculadas ao aviso e aparecem na auditoria.</p>
      </div>
      <div class="panel"><h3>Como a IA utilizará</h3><p>O aviso será pesquisável por versão, erro, módulo e descrição. A IA deverá confirmar a versão do cliente antes de aplicar a orientação.</p></div>
    </div></div><div class="dlg-foot"><div class="dlg-foot-inputs"></div><div class="dlg-foot-actions"><button class="primary" id="saveRelease">Salvar e disponibilizar para a IA</button></div></div>`;
  $('#relStatus').value = r.status || 'active'; $('#closeRelease').onclick = () => dlg.close();
  $('#saveRelease').onclick = async () => {
    const evidence = $('#relEvidence').value.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
      const match = line.match(/^(ticket|url|note):([^|]+)(?:\|\s*(.*))?$/i);
      return match ? {kind:match[1].toLowerCase(),value:match[2].trim(),label:(match[3] || '').trim()} : {kind:'note',value:line,label:''};
    });
    const body = {version_label:$('#relVersion').value.trim(),title:$('#relTitle').value.trim(),narrative:$('#relNarrative').value.trim(),
      impact:$('#relImpact').value.trim() || null,workaround:$('#relWorkaround').value.trim() || null,status:$('#relStatus').value,
      modules:[...document.querySelectorAll('input[name="relModule"]:checked')].map(x => x.value),
      error_messages:$('#relErrors').value.split('\n').map(x => x.trim()).filter(Boolean),evidence};
    $('#saveRelease').disabled = true;
    try { await api('/versoes-master' + (r.id ? `/${r.id}` : ''), {method:r.id ? 'PUT' : 'POST',body}); dlg.close(); await refresh(); toast('Aviso de versão aprovado e disponibilizado para a IA.'); }
    catch(e) { toast(e.message); $('#saveRelease').disabled = false; }
  };
  dlg.showModal();
}

async function transform(ticket, force = false, btn = null) {
  if (btn) btn.disabled = true;
  try {
    const c = await api('/candidatos', { method: 'POST', body: { ticket_external_id: ticket, force } });
    toast(`Ticket #${ticket} analisado.`); await refresh(); openCandidate(c.id);
  } catch (e) {
    if (e.status === 409 && e.detail?.signals) {
      const why = e.detail.signals.map(s => `${s.weight > 0 ? '+' : ''}${s.weight} ${s.label}`).join('\n');
      if (confirm(`${e.message}\n\n${why}\n\nAnalisar mesmo assim?`)) return transform(ticket, true, btn);
    } else toast(e.message);
  } finally { if (btn) btn.disabled = false; }
}

function moduleOptions(sel) { return state.taxonomy.map(m => `<option value="${m.key}" ${m.key === sel ? 'selected' : ''}>${esc(m.label)}</option>`).join(''); }
function subOptions(mod, sel) {
  const m = state.taxonomy.find(x => x.key === mod);
  if (!m || !m.subtopics) return '';
  return m.subtopics.map(([k, l]) => {
    const isChild = k.includes(':');
    const displayLabel = isChild ? `  ↳ ${l.replace(/^.*? > /, '')}` : l;
    return `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(displayLabel)}</option>`;
  }).join('');
}

      <div class="form-section">
        <div class="form-section-head"><h3>Conteúdo preparado pelo técnico</h3><span>Proposta de procedimento</span></div>
        <label>Pergunta do cliente relacionada</label><select id="ticketQuestionSelect">${(data.questions || []).map(q => `<option value="${esc(q.action_id)}">Nota ${esc(q.action_id)} · ${esc(q.created_at || '')} · ${esc(q.text.slice(0,120))}</option>`).join('')}</select>
        <label>Módulo obrigatório</label><select id="answerModule"><option value="">Selecione</option>${moduleOptions('').replace(/<option value="unclassified"[^>]*>.*?<\/option>/g,'')}</select>
        <label>Título curto do conhecimento</label><input id="proposalTitle" type="text" value="${esc(data.subject || '')}" placeholder="Ex.: Consultar produtos por fornecedor">
        <label>Resposta final para o cliente</label><textarea id="proposalAnswer" class="tall" placeholder="Ex.: Sim, o relatório está disponível no Master..."></textarea>
        <label>Passo a passo da resolução <small>— um passo por linha, começando por 1.</small></label><textarea id="proposalProcedure" class="tall" placeholder="1. Acesse Relatórios > Vendas > Histórico.&#10;2. Abra Produtos por Fabricante/Fornecedor.&#10;3. Selecione a aba Fornecedor."></textarea>
        <label>Prints (PNG, JPEG ou WebP; até 5 arquivos e 5 MB cada)</label><input id="proposalFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple>
        <div id="proposalImageList"></div>
        <label>Observação para os administradores <small>— opcional</small></label><textarea id="answerComment" placeholder="Ex.: caminho validado na versão atual do Master"></textarea>
        <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">Copiar uma resposta já registrada em outro ticket (opcional)</summary>
          <label>Ticket usado como evidência</label><div style="display:flex;gap:8px"><input id="exampleTicket" type="number" min="1" step="1" value="${ticket}"><button id="loadExampleAnswer" type="button">Carregar notas do ticket</button></div>
          <div id="exampleAnswerBox" style="display:none"><label>Nota da pergunta do cliente</label><select id="exampleQuestionSelect"></select><label>Nota da resposta humana</label><select id="exampleAnswerSelect"></select><button id="useExampleAnswer" type="button" style="margin-top:6px">Usar este par na proposta</button></div>
        </details>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button id="submitProposal" class="primary">Enviar para a fila de curadoria</button></div></div>`;
    $('#answerPreview').textContent = selected.text;
    const selectTicketQuestion = answer => {
      if (answer?.suggested_question_action_id && (data.questions || []).some(q => q.action_id === answer.suggested_question_action_id))
        $('#ticketQuestionSelect').value = answer.suggested_question_action_id;
    };
    selectTicketQuestion(selected);
    $('#answerSelect').onchange = e => { const answer = data.answers.find(a => a.action_id === e.target.value); $('#answerPreview').textContent = answer.text; selectTicketQuestion(answer); };
    let proposalFiles = [];
    $('#proposalFiles').onchange = e => {
      proposalFiles = [...e.target.files].slice(0, 5);
      if (e.target.files.length > 5) toast('Serão usados somente os 5 primeiros prints.');
      $('#proposalImageList').innerHTML = proposalFiles.map((file,i) => `<div class="grid2" style="margin-top:10px"><div><img src="${URL.createObjectURL(file)}" alt="Prévia" style="max-width:220px;max-height:120px;border-radius:8px;border:1px solid var(--line)"><small>${esc(file.name)}</small></div><div><label>Nome da imagem</label><input id="proposalName_${i}" value="${esc(file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '))}"><label>Onde exibir</label><select id="proposalPlace_${i}"><option value="answer">Após a resposta final</option><option value="procedure" selected>Após um passo</option></select><label>Número do passo</label><input id="proposalStep_${i}" type="number" min="1" max="100" value="${i+1}"><label>Legenda obrigatória</label><input id="proposalCaption_${i}" type="text" placeholder="O que este print demonstra"></div></div>`).join('');
    };
    let exampleQuestions = [], exampleAnswers = [];
    $('#exampleTicket').oninput = () => {
      exampleQuestions = []; exampleAnswers = []; $('#exampleAnswerBox').style.display = 'none';
    };
    const selectSuggestedQuestion = () => {
      const answer = exampleAnswers[Number($('#exampleAnswerSelect').value)];
      if (answer?.suggested_question_action_id && exampleQuestions.some(q => q.action_id === answer.suggested_question_action_id))
        $('#exampleQuestionSelect').value = answer.suggested_question_action_id;
    };
    $('#loadExampleAnswer').onclick = async () => {
      const exampleTicket = Number($('#exampleTicket').value);
      if (!Number.isInteger(exampleTicket) || exampleTicket <= 0) return toast('Informe um ticket válido.');
      $('#loadExampleAnswer').disabled = true;
      try {
        const source = await api(`/tickets/${exampleTicket}/respostas-tecnicas`);
        exampleQuestions = source.questions || [];
        exampleAnswers = source.answers || [];
        if (!exampleQuestions.length || !exampleAnswers.length) return toast('Não encontrei um par de pergunta do cliente e resposta humana nesse ticket sincronizado.');
        $('#proposalTitle').value ||= source.subject || '';
        $('#exampleQuestionSelect').innerHTML = exampleQuestions.map(q => `<option value="${esc(q.action_id)}">Nota ${esc(q.action_id)} · ${esc(q.created_at || '')} · ${esc(q.text.slice(0,90))}</option>`).join('');
        $('#exampleAnswerSelect').innerHTML = exampleAnswers.map((a,i) => `<option value="${i}">Ação ${esc(a.action_id)} · ${esc(a.created_at || '')} · ${esc(a.text.slice(0,90))}</option>`).join('');
        $('#exampleAnswerBox').style.display = 'block';
        $('#exampleAnswerSelect').value = String(exampleAnswers.length - 1);
        selectSuggestedQuestion();
        toast('Confira o par sugerido. Você pode trocar a pergunta ou a resposta antes de copiar.');
      } catch(e) { toast(e.message); }
      finally { $('#loadExampleAnswer').disabled = false; }
    };
    $('#exampleAnswerSelect').onchange = selectSuggestedQuestion;
    $('#useExampleAnswer').onclick = () => {
      const source = exampleAnswers[Number($('#exampleAnswerSelect').value)];
      if (!source) return;
      $('#proposalAnswer').value = source.text;
      if (!$('#proposalProcedure').value.trim()) $('#proposalProcedure').value = '1. ' + source.text;
      toast('Resposta copiada. Retire despedidas e trechos genéricos antes de enviar.');
    };
    $('#closeReview').onclick = () => dlg.close(); dlg.showModal();
    const submit = async () => {
      if (!$('#answerModule').value) return toast('Selecione o módulo.');
      if (!(data.questions || []).length && !exampleQuestions.length) return toast('Nenhuma pergunta do cliente foi encontrada. Sincronize o ticket antes de enviar.');
      const exampleTicket = Number($('#exampleTicket').value);
      const title = $('#proposalTitle').value.trim(), answer = $('#proposalAnswer').value.trim(), procedure = $('#proposalProcedure').value.trim();
      if (title.length < 5 || answer.length < 20) return toast('Preencha o título e a resposta final para o cliente.');
      if (!/^\s*1\.\s/m.test(procedure)) return toast('Escreva o passo a passo numerado, começando por “1.”.');
      $('#submitProposal').disabled = true;
      try {
        const proposedImages = await Promise.all(proposalFiles.map((file,i) => new Promise((resolve,reject) => {
          const reader = new FileReader(); reader.onerror = () => reject(new Error('Não foi possível ler um dos prints.'));
          reader.onload = () => { const placement=$(`#proposalPlace_${i}`).value; resolve({data_url:reader.result,name:$(`#proposalName_${i}`).value.trim(),placement,after_step:placement==='procedure'?Number($(`#proposalStep_${i}`).value):null,caption:$(`#proposalCaption_${i}`).value.trim()}); };
          reader.readAsDataURL(file);
        })));
        if (proposedImages.some(x => x.caption.length < 3)) throw new Error('Informe uma legenda para cada print.');
        const pairedAnswer = exampleAnswers[Number($('#exampleAnswerSelect').value)];
        const usingLoadedPair = !!pairedAnswer;
        const evidenceTicket = usingLoadedPair ? exampleTicket : ticket;
        const questionAction = usingLoadedPair ? $('#exampleQuestionSelect').value : $('#ticketQuestionSelect').value;
        const result = await api(`/tickets/${ticket}/avaliar`, {method:'POST',body:{action_id:$('#answerSelect').value,rating:-1,module_key:$('#answerModule').value,comment:$('#answerComment').value,example_ticket_id:evidenceTicket,proposed_title:title,proposed_answer:answer,proposed_procedure:procedure,proposed_images:proposedImages,question_action_id:questionAction,source_answer_action_id:usingLoadedPair ? pairedAnswer.action_id : null}});
        dlg.close(); await refresh();
        toast('Proposta enviada para a fila de curadoria. Ela ainda não foi publicada na IA.');
      } catch(e) { toast(e.message); }
      finally { if ($('#submitProposal')) $('#submitProposal').disabled = false; }
    };
    $('#submitProposal').onclick = submit;
  } catch(e) { toast(e.message); }
}

$('#reviewAnswerBtn').onclick = () => { const ticket = Number($('#ticketInput').value); if (Number.isInteger(ticket) && ticket > 0) reviewTicket(ticket); else toast('Informe o número do ticket.'); };
$('#modulesBtn').onclick = () => {
  dlg.innerHTML = `<div class="dlg-head"><div class="dlg-head-title"><span class="dlg-kicker">Taxonomia Canônica</span><h2>Gerenciar módulos</h2></div><div class="dlg-head-actions"><button id="closeModules">Fechar</button></div></div><div style="padding:20px 22px">
    <div class="form-section">
      <label>Módulo</label><select id="editModule"><option value="">Criar módulo</option>${moduleOptions('')}</select>
      <label>Chave permanente (não muda ao renomear)</label><input type="text" id="moduleKey" placeholder="exemplo: atendimento">
      <label>Nome exibido</label><input type="text" id="moduleLabel"><label>Descrição</label><input type="text" id="moduleDescription">
      <p class="muted" style="margin-top:10px">Renomear preserva a classificação e o histórico dos procedimentos.</p>
    </div>
    <div style="display:flex;justify-content:flex-end"><button class="primary" id="saveModule">Salvar módulo</button></div></div>`;
  $('#closeModules').onclick = () => dlg.close();
  $('#editModule').onchange = e => { const m = state.taxonomy.find(m => m.key === e.target.value); $('#moduleKey').value = m?.key || ''; $('#moduleKey').disabled = !!m; $('#moduleLabel').value = m?.label || ''; $('#moduleDescription').value = m?.description || ''; };
  $('#saveModule').onclick = async () => { try { state.taxonomy = await api('/taxonomia',{method:'POST',body:{key:$('#moduleKey').value,label:$('#moduleLabel').value,description:$('#moduleDescription').value}}); dlg.close(); await refresh(); toast('Módulo salvo.'); } catch(e) { toast(e.message); } };
  dlg.showModal();
};

(async () => {
  try {
    state.taxonomy = await api('/taxonomia');
    state.images = await api('/imagens');
    await refresh();
    const p = new URLSearchParams(location.search);
    const ticket = Number(p.get('ticket'));
    if (Number.isInteger(ticket) && ticket > 0) {
      $('#ticketInput').value = ticket;
      await reviewTicket(ticket, p.get('marker') || '');
    }
  } catch(err) {
    toast('Erro ao inicializar curadoria: ' + err.message);
  }
})();
</script>
</body>
</html>
