<title>CORTEX — Treinamento da IA</title>
<script>
  if (window.top === window.self) {
    const params = new URLSearchParams(window.location.search);
    const candidate = params.get('candidate') || '';
    const ticket = params.get('ticket') || '';
    const marker = params.get('marker') || '';
    if (/^\d+$/.test(candidate)) {
      document.documentElement.classList.add('standalone-candidate');
    } else if (/^\d+$/.test(ticket)) {
      const target = new URL('/treinamento/tecnico', window.location.origin);
      target.searchParams.set('ticket', ticket);
      if (/^CORTEX-AI-NOTE:[a-f0-9]{64}$/i.test(marker)) target.searchParams.set('marker', marker);
      window.location.replace(target);
    } else {
      const target = new URL('/admin', window.location.origin);
      target.searchParams.set('view', 'training');
      window.location.replace(target);
    }
  }
  (function syncInitialTheme() {
    try {
      if (window.top !== window.self) {
        document.documentElement.classList.add('embedded-in-admin');
      }
      const parentTheme = window.parent && window.parent !== window
        ? window.parent.document.documentElement.dataset.theme
        : null;
      const savedTheme = localStorage.getItem('cortex-theme');
      const theme = (parentTheme === 'light' || parentTheme === 'dark')
        ? parentTheme
        : (savedTheme === 'light' ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
      if (window.parent && window.parent !== window && window.parent.document?.documentElement) {
        new MutationObserver(() => {
          const next = window.parent.document.documentElement.dataset.theme;
          if (next) document.documentElement.dataset.theme = next;
        }).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      }
    } catch (_) {}
  })();
</script>

<script>
const API = '/api/treinamento';
const state = { tab: 'queue', module: null, subtopic: null, expandedSubs: {}, q: '', taxonomy: [], overview: null, images: [], staging: [], releases: [] };
const $ = (s, r = document) => r.querySelector(s);
function showTrainingDialog(dialog) {
  if (window.parent !== window) window.parent.scrollTo({top: 0, behavior: 'instant'});
  dialog.showModal();
  if (window.parent !== window) {
    window.parent.postMessage({type: 'cortex-training-dialog', open: true}, window.location.origin);
    requestAnimationFrame(() => {
      const body = dialog.querySelector('.dlg-body');
      if (body) body.scrollTop = 0;
    });
  }
}
function isStandaloneCandidateReview() {
  return document.documentElement.classList.contains('standalone-candidate');
}
function candidateReviewUrl(id) {
  return `/treinamento?candidate=${encodeURIComponent(id)}`;
}
function openCandidateTab(id) {
  const tab = window.open(candidateReviewUrl(id), '_blank');
  if (!tab) {
    toast('O navegador bloqueou a nova aba. Permita pop-ups para o Cortex e clique em Revisar novamente.');
    return null;
  }
  tab.opener = null;
  return tab;
}
function openTechnicalCuration(ticket) {
  const target = new URL('/treinamento/tecnico', window.location.origin);
  target.searchParams.set('ticket', String(ticket));
  const tab = window.open(target.href, '_blank');
  if (!tab) {
    toast('O navegador bloqueou a nova aba. Permita pop-ups para o Cortex e tente novamente.');
    return null;
  }
  tab.opener = null;
  return tab;
}
function closeCandidateReview() {
  if (!isStandaloneCandidateReview()) return $('#dlg').close();
  window.close();
  if (!window.closed) window.setTimeout(() => window.location.replace('/admin?view=training'), 100);
}
$('#dlg').addEventListener('close', () => {
  $('#dlg').classList.remove('candidate-dialog');
  $('#dlg').classList.remove('taxonomy-dialog');
  if (window.parent !== window) window.parent.postMessage({type: 'cortex-training-dialog', open: false}, window.location.origin);
});
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (d) => d ? new Date(d).toLocaleString('pt-BR') : '—';
const REL = { duplicate: ['warn', 'Duplicado'], evolution: ['ok', 'Evolução'], different_context: ['ok', 'Outro contexto'], conflict: ['bad', 'Conflito'] };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 4200); }
async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    let msg = 'Erro na operação';
    if (typeof data.detail === 'string') {
      msg = data.detail;
    } else if (Array.isArray(data.detail)) {
      msg = data.detail.map(d => {
        const field = (d.loc || []).filter(p => p !== 'body').join('.');
        return field ? `${field}: ${d.msg}` : d.msg;
      }).join(';\n') || 'Erro de validação';
    } else if (data.detail?.message) {
      msg = data.detail.message;
    } else if (data.message) {
      msg = data.message;
    }
    const err = new Error(msg);
    err.status = r.status;
    err.detail = data.detail;
    throw err;
  }
  return data;
}

function modLabel(k) { return (state.taxonomy.find(m => m.key === k) || {}).label || k; }
function subLabel(m, s) { return (((state.taxonomy.find(x => x.key === m) || {}).subtopics || []).find(x => x[0] === s) || [])[1] || s; }
function moduleGlyph(key) {
  return ({products:'▱', fiscal:'▤', integrations:'↗', sales:'▣', finance:'$', logistics:'▰',
    purchases:'▣', registration:'♙', production:'▥', infrastructure:'▤', unclassified:'◇'})[key] || '◈';
}
function scoreBadge(s) {
  const c = s >= 75 ? ['#d1fadf','#05603a'] : s >= 55 ? ['#fef0c7','#93370d'] : ['#fee4e2','#912018'];
  return `<div class="score" style="background:${c[0]};color:${c[1]}">${s}</div>`;
}

async function loadOverview() {
  const o = await api('/overview');
  state.overview = o;
  const t = o.totals || {};
  $('#stats').innerHTML = [
    ['Procedimentos ativos na IA', t.active || 0],
    ['Aguardando revisão', t.pending || 0],
    ['Conflitos abertos', t.conflicts || 0],
    ['Procedimentos inativados', t.deprecated || 0],
    ['Sem vetor semântico', t.without_vector || 0]
  ].map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');

  const renderSubtopic = (node, moduleKey, depth, parentKey = '') => {
    const hasChildren = (node.children || []).length > 0;
    const isExpanded = !!state.expandedSubs[node.key] || (state.subtopic && state.subtopic.startsWith(node.key + ':'));
    const isActive = state.subtopic === node.key;
    const className = depth === 1 ? 'sub' : 'sub-sub';
    const childrenHtml = hasChildren && isExpanded
      ? node.children.map(child => renderSubtopic(child, moduleKey, depth + 1, node.key)).join('') : '';
    const sharedKey = taxonomyNodes().filter(entry => entry.node.key === node.key).length > 1;
    const actionButtons = node.key === 'general' || sharedKey || depth >= 2 ? '' : `<span class="taxonomy-inline-actions">
        <button type="button" data-tax-action="add" data-tax-key="${esc(node.key)}" title="Criar subcategoria" aria-label="Criar filho de ${esc(node.label)}">+</button>
      </span>`;
    return `<div class="${className} ${isActive ? 'active' : ''}" data-m="${esc(moduleKey)}" data-s="${esc(node.key)}" data-parent-s="${esc(parentKey)}" ${hasChildren ? 'data-parent="1"' : ''}>
        <span class="tree-row-main" style="padding-left:${Math.max(0, depth - 1) * 10}px"><span class="tree-arrow tree-arrow-sub">${hasChildren ? isExpanded ? '▾' : '▸' : ''}</span><span class="tree-row-label">${esc(node.label)}</span></span>
        <span class="tree-row-actions"><span class="tree-count">${node.items || 0}</span>${actionButtons}</span>
      </div>${childrenHtml}`;
  };

  $('#tree').innerHTML = `<h2>Módulos do Master</h2><div class="mod tree-all-row ${!state.module ? 'active' : ''}" data-m="">
      <span class="tree-row-main"><span class="tree-module-icon">▱</span><span class="tree-row-label">Todos os módulos</span></span><span class="tree-row-actions"><span class="tree-count">${t.active || 0}</span><span class="tree-arrow">›</span></span>
    </div>` +
    (o.modules || []).map(m => {
      const isModOpen = state.module === m.key;
      const modActive = isModOpen && !state.subtopic ? 'active' : '';
      const modArrow = `<span class="tree-arrow">${isModOpen ? '▾' : '▸'}</span>`;
      const subtopicsHtml = isModOpen ? (m.subtopics || []).map(s => renderSubtopic(s, m.key, 1)).join('') : '';
      const canEditModule = m.key !== 'unclassified';

      return `
        <div class="mod ${modActive}" data-m="${m.key}" title="${esc(m.description)}">
          <span class="tree-row-main">${modArrow}<span class="tree-module-icon">${moduleGlyph(m.key)}</span><span class="tree-row-label">${esc(m.label)}</span></span>
          <span class="tree-row-actions">${m.pending ? `<span class="pill warn">${m.pending} fila</span> ` : ''}<span class="tree-count">${m.items}</span>${canEditModule ? `<span class="taxonomy-inline-actions"><button type="button" data-tax-action="add" data-tax-key="${esc(m.key)}" title="Criar categoria" aria-label="Criar filho de ${esc(m.label)}">+</button></span>` : ''}</span>
        </div>
        ${subtopicsHtml}`;
    }).join('');
}

$('#tree').addEventListener('click', (e) => {
  const taxonomyAction = e.target.closest('[data-tax-action]');
  if (taxonomyAction) {
    e.preventDefault(); e.stopPropagation();
    openTaxonomyManager({action: taxonomyAction.dataset.taxAction, key: taxonomyAction.dataset.taxKey});
    return;
  }
  const el = e.target.closest('[data-m]'); if (!el) return;
  const m = el.dataset.m || null;
  const s = el.dataset.s || null;
  const isParent = el.dataset.parent === '1';
  const parentSubtopic = el.dataset.parentS || null;

  if (!m) {
    state.module = null;
    state.subtopic = null;
    refresh();
    return;
  }

  if (!s) {
    if (state.module === m) {
      // Toggle accordion: collapse back inside the module
      state.module = null;
      state.subtopic = null;
    } else {
      state.module = m;
      state.subtopic = null;
    }
    refresh();
    return;
  }

  if (isParent) {
    const isExpanded = !!state.expandedSubs[s] || (state.subtopic && state.subtopic.startsWith(s + ':'));
    if (isExpanded && state.subtopic === s) {
      delete state.expandedSubs[s];
      state.subtopic = null;
    } else {
      state.expandedSubs[s] = true;
      state.subtopic = s;
    }
    refresh();
    return;
  }

  if (state.subtopic === s) {
    state.subtopic = parentSubtopic;
  } else {
    state.subtopic = s;
  }
  refresh();
});

async function transform(ticket, force = false, btn = null, reviewTab = null) {
  if (btn) btn.disabled = true;
  if (!isStandaloneCandidateReview() && !reviewTab) {
    reviewTab = window.open('about:blank', '_blank');
    if (reviewTab) reviewTab.opener = null;
  }
  try {
    const c = await api('/candidatos', { method: 'POST', body: { ticket_external_id: ticket, force } });
    if (reviewTab) reviewTab.location.replace(candidateReviewUrl(c.id));
    else if (isStandaloneCandidateReview()) await openCandidate(c.id);
    else openCandidateTab(c.id);
    toast(`Ticket #${ticket} enviado para a curadoria.`); await refresh();
  } catch (e) {
    if (e.status === 409 && e.detail?.signals) {
      const why = e.detail.signals.map(s => `${s.weight > 0 ? '+' : ''}${s.weight} ${s.label}`).join('\n');
      if (confirm(`${e.message}\n\n${why}\n\nAnalisar mesmo assim?`)) return await transform(ticket, true, btn, reviewTab);
      reviewTab?.close();
    } else { reviewTab?.close(); toast(e.message); }
  } finally { if (btn) btn.disabled = false; }
}
$('#transformBtn').onclick = () => {
  const n = parseInt($('#ticketInput').value, 10);
  if (!n) return toast('Informe o número do ticket.');
  openTechnicalCuration(n);
};

function moduleOptions(sel) { return state.taxonomy.map(m => `<option value="${m.key}" ${m.key === sel ? 'selected' : ''}>${esc(m.label)}</option>`).join(''); }
function subOptions(mod, sel) {
  const m = state.taxonomy.find(x => x.key === mod);
  if (!m || !m.subtopics || !m.subtopics.length) return '<option value="general">Geral / outros</option>';
  return m.subtopics.map(([k, l]) => {
    const isChild = k.includes(':');
    const displayLabel = isChild ? `  ↳ ${l.replace(/^.*? > /, '')}` : l;
    return `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(displayLabel)}</option>`;
  }).join('');
}

function candidateSubtree(mod, selected) {
  const m = state.taxonomy.find(x => x.key === mod);
  const topics = m?.subtopics || [];
  const parents = topics.filter(([key]) => !key.includes(':'));
  const label = topics.find(([key]) => key === selected)?.[1] || 'Escolha uma subcategoria';
  return `<input id="f_sub" type="hidden" value="${esc(selected || '')}">
    <div class="subtree-picker"><button type="button" class="subtree-trigger" id="subtree-trigger" aria-expanded="false" aria-controls="subtree-menu">${esc(label)} <span>▾</span></button>
    <div class="subtree-menu" id="subtree-menu" hidden>
      ${parents.map(([key, name]) => {
        const children = topics.filter(([child]) => child.startsWith(key + ':'));
        if (!children.length) return `<button type="button" class="subtree-option ${selected === key ? 'active' : ''}" data-subchoice="${esc(key)}">${esc(name)}</button>`;
        return `<details class="subtree-group"><summary>${esc(name)}</summary>
          <button type="button" class="subtree-option subtree-parent-option ${selected === key ? 'active' : ''}" data-subchoice="${esc(key)}">Selecionar ${esc(name)} (geral)</button>
          ${children.map(([child, childName]) => `<button type="button" class="subtree-option ${selected === child ? 'active' : ''}" data-subchoice="${esc(child)}">${esc(childName.replace(/^.*? > /, ''))}</button>`).join('')}</details>`;
      }).join('')}
    </div></div>`;
}

function bindCandidateSubtree() {
  const trigger = $('#subtree-trigger'), menu = $('#subtree-menu');
  trigger.onclick = () => { const open = menu.hidden; menu.hidden = !open; trigger.setAttribute('aria-expanded', String(open)); if (open) menu.querySelectorAll('details').forEach(d => d.open = false); };
  menu.onclick = e => {
    const option = e.target.closest('[data-subchoice]'); if (!option) return;
    const key = option.dataset.subchoice;
    $('#f_sub').value = key;
    const m = state.taxonomy.find(x => x.key === $('#f_module').value);
    trigger.firstChild.textContent = (m?.subtopics || []).find(([k]) => k === key)?.[1] || key;
    menu.hidden = true; trigger.setAttribute('aria-expanded', 'false');
    menu.querySelectorAll('.subtree-option').forEach(el => el.classList.toggle('active', el.dataset.subchoice === key));
  };
}

function bindCandidateForm() {
  $('#f_module').onchange = e => { $('#candidate-subtree').innerHTML = candidateSubtree(e.target.value, ''); bindCandidateSubtree(); };

function imagesForCandidateAction(context, event) {
  if (!event) return [];
  const byUrl = new Map((context.images || [])
    .filter(image => String(image.action_id) === String(event.id))
    .map(image => [image.url, image]));
  (event.images || []).forEach(image => byUrl.set(image.url, image));
  return [...byUrl.values()];
}

function answerSourceEvent(c, context) {
  const history = context.history || [];
  const sourceId = String(c.source_answer_action_id || '');
  const selected = sourceId && history.find(event => String(event.id) === sourceId && event.role === 'technician');
  if (selected) return selected;
  return [...history].reverse().find(event => event.role === 'technician' && imagesForCandidateAction(context, event).length)
      || [...history].reverse().find(event => event.role === 'technician')
      || null;
}

async function hydrateCandidateAnswerFromTicket(c) {
  const context = c.ticket_context || {};
  const source = answerSourceEvent(c, context);
  if (!source || !c.ticket_external_id) return;
  const imageRefs = imagesForCandidateAction(context, source).sort((a, b) => Number(a.index) - Number(b.index));
  const installSourceHtml = (html, text) => {
    const template = document.createElement('template');
    template.innerHTML = html || '';
    const inlineImages = [...template.content.querySelectorAll('img')];
    c._answerImageRefs = [];
    inlineImages.forEach((image, index) => {
      const reference = imageRefs[index];
      if (!reference) return;
      image.setAttribute('src', reference.url);
      if (reference.name) image.setAttribute('alt', reference.name);
      c._answerImageRefs.push({
        ...reference,
        after_answer_paragraph: answerParagraphForImage(image, template.content),
      });
    });
    source.html = template.innerHTML;
    if (text) source.text = text;
  };
  try {
    // The older candidate endpoint returns action text and image files separately.
    // This endpoint preserves the original inline image positions in the technician reply.
    const ticket = await api(`/tickets/${encodeURIComponent(c.ticket_external_id)}/respostas-tecnicas`);
    const actionId = String(source.id || c.source_answer_action_id || ticket.recommended_action_id || '');
    const answer = (ticket.answers || []).find(item => String(item.action_id) === actionId)
      || [...(ticket.answers || [])].reverse().find(item => item.html);
    if (answer?.html) {
      installSourceHtml(answer.html, answer.text || source.text);
      return;
    }
  } catch (error) {
    // Fall back to a rich action snapshot if the full ticket endpoint is unavailable.
    console.warn('Não foi possível recuperar a ordem original dos prints do chamado.', error);
  }
  if (source.html) installSourceHtml(source.html, source.text);
}

function answerPlainText(root) {
  const parts = [];
  const walk = node => {
    if (node.nodeType === Node.TEXT_NODE) { parts.push(node.textContent); return; }
    if (node.nodeType !== Node.ELEMENT_NODE && node.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) return;
    if (node.matches?.('img,.candidate-inline-image,.candidate-inline-toolbar,.candidate-image-status,.answer-inline-image-tools')) return;
    if (node.nodeName === 'BR') { parts.push('\n'); return; }
    const block = /^(P|DIV|LI|H[1-6]|BLOCKQUOTE|PRE|TR)$/.test(node.nodeName);
    if (block) parts.push('\n');
    node.childNodes.forEach(walk);
    if (block) parts.push('\n');
  };
  root.childNodes.forEach(walk);
  return parts.join('').replace(/\u00a0/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

function answerParagraphForImage(image, root) {
  const before = document.createRange();
  before.setStart(root, 0);
  before.setEndBefore(image);
  const lines = answerPlainText(before.cloneContents()).split('\n').filter(line => line.trim());
  return Math.max(1, lines.length);
}

function stageCandidateAnswerImages(c, imported) {
  const refs = c._answerImageRefs || [];
  const prepared = [];
  for (let i = 0; i < refs.length; i++) {
    const reference = refs[i];
    const file = `candidate-${c.id}-${reference.action_id}-${reference.index}.png`;
    const name = `Print técnico ${i + 1}`;
    const preview = {file,label:name,url:reference.url,candidate_source:true};
    if (!state.images.some(item => item.file === file)) state.images.push(preview);
    imported.set(reference.url, file);
    reference.file = file;
    reference.saved_url = reference.url;
    reference.label = name;
    prepared.push({file,name,caption:'',placement:'answer',after_step:null,
      after_answer_paragraph:reference.after_answer_paragraph});
  }
  return prepared;
}

function ensureCandidateImagesInAnswer(html, content) {
  const template = document.createElement('template');
  template.innerHTML = html || '';
  const selected = (content.images || []).map(chosen => ({
    chosen,
    source: state.images.find(image => image.file === chosen.file),
  })).filter(item => item.source);
  const existingCount = template.content.querySelectorAll('img').length;
  for (const {chosen, source} of selected.slice(existingCount)) {
    const paragraph = document.createElement('p');
    const image = document.createElement('img');
    image.src = source.url;
    image.alt = chosen.caption || chosen.name || source.label || 'Print da resposta técnica';
    image.loading = 'lazy';
    image.dataset.candidateFile = chosen.file;
    paragraph.append(image);
    const position = Math.max(1, Number(chosen.after_answer_paragraph) || 999);
    const blocks = [...template.content.querySelectorAll('p,li')].filter(block => !block.querySelector('img'));
    const anchor = blocks[Math.min(position - 1, blocks.length - 1)];
    if (anchor) anchor.after(paragraph); else template.content.append(paragraph);
  }
  return template.innerHTML;
}

function candidateAnswerHtml(c, content, context) {
  const source = answerSourceEvent(c, context);
  if (content.customer_answer_html) return ensureCandidateImagesInAnswer(content.customer_answer_html, content);
  if (content.validated_html) return ensureCandidateImagesInAnswer(content.validated_html, content);
  if (source?.html) return ensureCandidateImagesInAnswer(source.html, content);
  const answer = content.customer_answer || context.technician_reply || source?.text || '';
  const paragraphs = esc(answer).replace(/\r\n?/g, '\n').split('\n').map(line =>
    line ? `<p>${line}</p>` : '<p><br></p>').join('');
  const prints = imagesForCandidateAction(context, source)
    .map(image => `<p><img src="${esc(image.url)}" alt="${esc(image.name || 'Print da resposta técnica')}" loading="lazy"></p>`)
    .join('');
  return ensureCandidateImagesInAnswer(paragraphs + prints, content);
}

function updateNoteLivePreview() {
  const box = $('#noteLivePreview');
  if (!box) return;
  const rawText = $('#f_proc')?.value || '';
  const lines = rawText.split('\n').filter(l => l.trim().length > 0);
  
  const imageInputs = [...document.querySelectorAll('[id^="img_use_"]')];
  const activeImages = [];
  imageInputs.forEach(input => {
    if (!input.checked) return;
    const i = Number(input.id.split('_').pop());
    const place = $('#img_place_' + i)?.value || 'procedure';
    const target = Number($('#img_target_pos_' + i)?.value) || (i + 1);
    const itemContainer = input.closest('.review-image-item');
    const imgEl = itemContainer ? itemContainer.querySelector('img') : null;
    const src = imgEl ? imgEl.src : '';
    const name = ($('#img_name_' + i)?.value || '').trim() || `Print ${i + 1}`;
    const caption = ($('#img_caption_' + i)?.value || '').trim();
    activeImages.push({ index: i, place, target, src, name, caption, file: input.dataset.file });
  });

  const stepImages = {};
  const paraImages = {};
  activeImages.forEach(img => {
    if (img.place === 'procedure') {
      stepImages[img.target] = stepImages[img.target] || [];
      stepImages[img.target].push(img);
    } else {
      paraImages[img.target] = paraImages[img.target] || [];
      paraImages[img.target].push(img);
    }
  });

  let html = '<p><strong>Cortex — resposta sugerida ao cliente (nota interna)</strong></p>';
  let paraCount = 0;
  const renderedFiles = new Set();

  function renderImg(img) {
    renderedFiles.add(img.file);
    const showHeader = img.name && !img.name.toLowerCase().startsWith('print ');
    const headerHtml = showHeader ? `<p><strong>${esc(img.name)}</strong></p>` : '';
    const capHtml = img.caption ? `<p><small>${esc(img.caption)}</small></p>` : '';
    return `${headerHtml}<p style="margin:8px 0"><img src="${esc(img.src)}" style="max-width:100%;max-height:240px;border-radius:6px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,0.06);display:block"></p>${capHtml}`;
  }

  lines.forEach(line => {
    html += `<p style="margin:4px 0">${esc(line)}</p>`;
    paraCount++;
    (paraImages[paraCount] || []).forEach(img => html += renderImg(img));
    const stepMatch = line.trim().match(/^(\d+)\.\s/);
    if (stepMatch) {
      const stepNum = parseInt(stepMatch[1], 10);
      (stepImages[stepNum] || []).forEach(img => html += renderImg(img));
    }
  });

  activeImages.forEach(img => {
    if (!renderedFiles.has(img.file)) {
      html += renderImg(img);
    }
  });

  const title = ($('#f_title')?.value || 'Procedimento oficial').trim();
  html += `<p style="margin-top:14px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:12px"><strong>Procedimento oficial:</strong> ${esc(title)} (v1 · aprovado por alternativa)</p>`;
  html += `<p style="color:var(--brand);font-size:12px"><u>Sugerir ajuste ou melhoria neste procedimento</u> (uso interno)</p>`;

  box.innerHTML = html;
}

        ctx.save(); ctx.beginPath(); ctx.arc(point.x, point.y, point.radius, 0, Math.PI * 2); ctx.clip();

        else { ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        ctx.restore();
      };

        wrapper._undoStack.push(snapshot()); if (wrapper._undoStack.length > 12) wrapper._undoStack.shift();
        drawing = true; lastPoint = pointFor(event);

          const blurred = blurredCopy.getContext('2d');
          blurred.filter = `blur(${Math.max(5, lastPoint.radius * .5)}px)`;
          blurred.drawImage(canvas, 0, 0); blurred.filter = 'none';
        }

      };
      canvas.onpointermove = event => {
        if (!drawing) return;
        const next = pointFor(event), distance = Math.hypot(next.x - lastPoint.x, next.y - lastPoint.y);
        const count = Math.max(1, Math.ceil(distance / Math.max(2, next.radius * .45)));
        for (let step = 1; step <= count; step++) {
          const t = step / count;
          dot({x:lastPoint.x + (next.x-lastPoint.x)*t,y:lastPoint.y + (next.y-lastPoint.y)*t,radius:next.radius}, wrapper.dataset.mode);
        }

    const origText = b.textContent;
    b.textContent = act === 'new' ? 'Publicando...' : 'Processando...';

    try {
      if (act === 'new' || act === 'revise') await persistCandidateImageEdits();
      if (act === 'observe') await api(`/candidatos/${id}/observar`, { method: 'POST', body: { reason } });
      else if (act === 'reject') await api(`/candidatos/${id}/rejeitar`, { method: 'POST', body: { reason } });
      else if (act === 'return') await api(`/candidatos/${id}/devolver`, { method: 'POST', body: { reason } });
      else await api(`/candidatos/${id}/aprovar`, { method: 'POST', body: { decision: act, reason, target_item_id: target, content: act === 'attach' ? null : readForm() } });
      closeCandidateReview();
      toast(act === 'observe' ? 'Observação registrada somente na auditoria.'
        : act === 'reject' ? 'Sugestão rejeitada.'
        : act === 'return' ? 'Ajuste solicitado ao técnico.'
        : act === 'attach' ? 'Ticket anexado como evidência.'
        : act === 'revise' ? 'Nova versão publicada e classificada também em Versão.'
        : 'Publicado como novo — já disponível para a IA.');
      if (!isStandaloneCandidateReview()) refresh();
    } catch (e) {
      showError(e.message);
    } finally {
      allBtns.forEach(btn => btn.disabled = false);
      b.textContent = origText;
    }
  });
}

function taxonomyNodes() {
  const entries = [];
  const visit = (node, parentKey = null, depth = 0) => {
    entries.push({node, parentKey, depth});
    (node.nodes || node.children || []).forEach(child => visit(child, node.key, depth + 1));
  };
  state.taxonomy.forEach(root => visit(root));
  return entries;
}

function normalizeTaxonomy(payload) {
  return (payload || []).map(root => {
    if (Array.isArray(root.nodes)) return root;
    const rows = (root.subtopics || []).filter(pair => Array.isArray(pair) && pair[0] !== 'general');
    const nodes = rows.filter(([, label]) => !String(label).includes(' > '))
      .map(([key, label]) => ({key, label, description: '', nodes: []}));
    for (const [key, fullLabel] of rows.filter(([, label]) => String(label).includes(' > '))) {
      const parts = String(fullLabel).split(/\s*>\s*/);
      const parentKey = key.includes(':') ? key.slice(0, key.lastIndexOf(':')) : '';
      const parent = nodes.find(node => node.key === parentKey) || nodes.find(node => node.label === parts[0]);
      if (parent && !nodes.some(node => node.key === key))
        (parent.nodes ||= []).push({key, label: parts.at(-1), description: '', nodes: []});
      else if (!nodes.some(node => node.key === key))
        nodes.push({key, label: parts.at(-1), description: '', nodes: []});
    }
    return {...root, nodes};
  });
}

function taxonomyKeyFor(label, parentKey = null) {
  const slug = String(label || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'categoria';
  const parentEntry = parentKey ? taxonomyNodes().find(entry => entry.node.key === parentKey) : null;
  const separator = parentEntry?.depth === 0 ? '_' : ':';
  let base = parentKey ? `${parentKey}${separator}${slug}` : (/^[a-z]/.test(slug) ? slug : `mod_${slug}`);
  base = base.slice(0, 60).replace(/[:_]+$/g, '') || 'categoria';
  const used = new Set(taxonomyNodes().map(entry => entry.node.key));
  let candidate = base, index = 2;
  while (used.has(candidate)) {
    const suffix = `_${index++}`;
    candidate = `${base.slice(0, 60 - suffix.length).replace(/[:_]+$/g, '')}${suffix}`;
  }
  return candidate;
}

    const mod = (state.overview?.modules || []).find(item => item.key === moduleKey);
    if (!mod) return 0;
    if (key === moduleKey) return mod.items || 0;
    const visit = nodes => {
      for (const node of nodes || []) {
        if (node.key === key) return node.items || 0;
        const found = visit(node.children || []); if (found) return found;
      }
      return 0;
    };
    return visit(mod.subtopics || []);
  };
  const sharedKey = key => managerEntries().filter(entry => entry.node.key === key).length > 1;
  const selectedEntry = () => selectedRef ? findEntry(selectedRef.key, selectedRef.parentKey, selectedRef.moduleKey) : null;
  const addExpandedPath = entry => {
    if (!entry) return;
    let cursor = entry;
    while (cursor) {
      if (childrenOf(cursor.node).length) expanded.add(refId(cursor.moduleKey, cursor.node.key));
      cursor = cursor.parentKey ? findEntry(cursor.parentKey, undefined, cursor.moduleKey) : null;
    }
  };

  const allEntries = managerEntries();
  let selectedEntryInitial = initial.key
    ? allEntries.find(entry => entry.node.key === initial.key)
    : null;
  if (!selectedEntryInitial && state.subtopic)
    selectedEntryInitial = allEntries.find(entry => entry.node.key === state.subtopic && entry.moduleKey === state.module);
  if (!selectedEntryInitial && state.module)
    selectedEntryInitial = allEntries.find(entry => entry.node.key === state.module && entry.depth === 0);
  if (!selectedEntryInitial)
    selectedEntryInitial = allEntries.find(entry => entry.depth === 0 && entry.node.key !== 'unclassified') || allEntries[0];
  let selectedRef = selectedEntryInitial ? {key:selectedEntryInitial.node.key, parentKey:selectedEntryInitial.parentKey,
    moduleKey:selectedEntryInitial.moduleKey} : null;
  addExpandedPath(selectedEntryInitial);

  const nodeMatches = node => {
    if (!searchText) return true;
    if (String(node.label || '').toLocaleLowerCase('pt-BR').includes(searchText)) return true;
    return childrenOf(node).some(nodeMatches);
  };
  const renderNavNode = (node, parentKey, depth, moduleKey) => {
    if (!nodeMatches(node)) return '';
    const children = childrenOf(node);
    const id = refId(moduleKey, node.key);
    const isExpanded = expanded.has(id) || (!!searchText && children.some(nodeMatches));
    const isSelected = selectedRef?.key === node.key && selectedRef?.parentKey === (parentKey || null) && selectedRef?.moduleKey === moduleKey;
    const canAdd = depth < 2 && node.key !== 'unclassified' && !sharedKey(node.key);
    const count = countFor(moduleKey, node.key);
    const childrenHtml = isExpanded ? children.map(child => renderNavNode(child, node.key, depth + 1, moduleKey)).join('') : '';
    const glyph = depth === 0 ? moduleGlyph(node.key) : (depth === 1 ? '▤' : '·');
    return `<div class="taxonomy-nav-row taxonomy-nav-depth-${depth} ${isSelected ? 'selected' : ''}">
      <button class="taxonomy-nav-caret" type="button" data-tax-toggle="${esc(node.key)}" data-tax-module="${esc(moduleKey)}" ${children.length ? '' : 'disabled'} aria-label="${isExpanded ? 'Recolher' : 'Expandir'}">${children.length ? (isExpanded ? '⌄' : '›') : ''}</button>
      <button class="taxonomy-nav-select" type="button" data-tax-select="${esc(node.key)}" data-tax-parent="${esc(parentKey || '')}" data-tax-module="${esc(moduleKey)}">
        <span class="tree-module-icon">${glyph}</span><strong>${esc(node.label)}</strong><span class="taxonomy-nav-count">${count}</span>
      </button>
      ${canAdd ? `<button class="taxonomy-nav-add" type="button" data-tax-action="add" data-tax-key="${esc(node.key)}" data-tax-parent="${esc(parentKey || '')}" data-tax-module="${esc(moduleKey)}" title="Criar filho" aria-label="Criar filho de ${esc(node.label)}">＋</button>` : ''}
    </div>${childrenHtml}`;
  };
  const renderTree = () => {
    const roots = state.taxonomy.filter(nodeMatches).map(root => renderNavNode(root, null, 0, root.key)).join('');
    treeEl.innerHTML = `<button class="taxonomy-nav-row taxonomy-nav-select tree-all-row ${selectedRef ? '' : 'selected'}" type="button" data-tax-all="1"><span class="tree-module-icon">▱</span><strong>Todos os módulos</strong><span class="taxonomy-nav-count">${state.overview?.totals?.active || 0}</span></button>${roots || '<div class="taxonomy-empty">Nenhum módulo ou categoria encontrada.</div>'}`;
  };
  const editorMarkup = entry => {
    if (!editing) return '';
    const parent = editing.parentKey ? findEntry(editing.parentKey, undefined, editing.moduleKey)?.node : null;
    const isRoot = !editing.parentKey;
    return `<div class="taxonomy-edit-form"><h4>${editing.mode === 'edit' ? 'Renomear item' : (parent ? `Nova categoria em ${esc(parent.label)}` : 'Novo módulo')}</h4>
      <label for="taxonomyName">Nome</label><input id="taxonomyName" maxlength="80" autocomplete="off" value="${editing.mode === 'edit' ? esc(editing.node.label) : ''}" placeholder="Digite o nome">
      ${isRoot ? `<label for="taxonomyDescription">Descrição (opcional)</label><input id="taxonomyDescription" maxlength="500" value="${esc(editing.mode === 'edit' ? editing.node.description || '' : '')}" placeholder="Resumo do módulo">` : ''}
      <p class="taxonomy-category-meta">${editing.mode === 'edit' ? `A chave interna “${esc(editing.key)}” será mantida.` : (parent ? `Este item será criado abaixo de “${esc(parent.label)}”.` : 'Este módulo ficará na raiz da taxonomia.')}</p>
      <div class="taxonomy-edit-actions"><button type="button" data-tax-cancel="1">Cancelar</button><button class="primary" type="button" data-tax-save="1">Salvar</button></div></div>`;
  };
  const renderDetail = () => {
    const entry = selectedEntry();
    if (!entry) {
      const modules = state.taxonomy.filter(nodeMatches);
      const moduleRows = modules.map(node => {
        const count = countFor(node.key, node.key);
        const summary = node.description || `${childrenOf(node).length} categorias · ${count} procedimentos`;
        return `<div class="taxonomy-category-row">
          <button type="button" data-tax-select="${esc(node.key)}" data-tax-module="${esc(node.key)}">
            <span class="taxonomy-category-icon">${moduleGlyph(node.key)}</span><span class="taxonomy-category-copy"><span class="taxonomy-category-name">${esc(node.label)}</span><span class="taxonomy-category-meta">${esc(summary)}</span></span><span class="taxonomy-category-count">${count}</span><span class="taxonomy-category-chevron">›</span>
          </button>
        </div>`;
      }).join('') || '<div class="taxonomy-empty">Nenhum módulo encontrado.</div>';
      detailEl.innerHTML = `<div class="taxonomy-detail-head"><div class="taxonomy-detail-title"><div class="taxonomy-detail-icon">▱</div><div><h3>Todos os módulos</h3><div class="taxonomy-breadcrumb">Taxonomia canônica</div></div><span class="taxonomy-nav-count">${modules.length} módulos</span></div>
          <div class="taxonomy-detail-actions"><button class="primary" type="button" data-tax-root="1" data-tax-action="add">＋ Novo módulo</button></div>
        </div><p class="taxonomy-desc">Selecione um módulo para organizar suas categorias e subcategorias.</p>
        <section class="taxonomy-category-section"><div class="taxonomy-category-heading"><h4>Módulos</h4><span class="taxonomy-nav-count">${modules.length}</span></div><div class="taxonomy-category-list">${moduleRows}</div></section>
        ${editorMarkup(null)}`;
      return;
    }
    const children = childrenOf(entry.node);
    const canAdd = entry.depth < 2 && entry.node.key !== 'unclassified' && !sharedKey(entry.node.key);
    const canEdit = entry.node.key !== 'unclassified' && !sharedKey(entry.node.key);
    const descendantCount = node => childrenOf(node).reduce((sum, child) => sum + 1 + descendantCount(child), 0);
    const description = entry.node.description || (entry.depth === 0 ? 'Categorias e subcategorias usadas para classificar o conhecimento do ERP Master.' : 'Categoria da taxonomia canônica.');
    const childRows = children.length ? children.map(child => {
      const childDepth = entry.depth + 1;
      const childShared = sharedKey(child.key);
      const childCanAdd = childDepth < 2 && child.key !== 'unclassified' && !childShared;
      const childParentKey = entry.node.key;
      const itemCount = countFor(entry.moduleKey, child.key);
      const childSummary = child.description || (descendantCount(child)
        ? `${descendantCount(child)} subcategorias · ${itemCount} procedimentos`
        : `${itemCount} procedimentos nesta categoria`);
      return `<div class="taxonomy-category-row">
        <button type="button" data-tax-select="${esc(child.key)}" data-tax-parent="${esc(childParentKey)}" data-tax-module="${esc(entry.moduleKey)}">
          <span class="taxonomy-category-icon">▤</span><span class="taxonomy-category-copy"><span class="taxonomy-category-name">${esc(child.label)}</span><span class="taxonomy-category-meta">${esc(childSummary)}</span></span><span class="taxonomy-category-count">${itemCount}</span><span class="taxonomy-category-chevron">›</span>
        </button>
        ${childCanAdd ? `<button class="taxonomy-nav-add" type="button" data-tax-action="add" data-tax-key="${esc(child.key)}" data-tax-parent="${esc(childParentKey)}" data-tax-module="${esc(entry.moduleKey)}" title="Criar neto" aria-label="Criar filho de ${esc(child.label)}">＋</button>` : ''}
        ${child.key !== 'unclassified' && !childShared ? `<button type="button" data-tax-action="edit" data-tax-key="${esc(child.key)}" data-tax-parent="${esc(childParentKey)}" data-tax-module="${esc(entry.moduleKey)}" title="Renomear" aria-label="Renomear ${esc(child.label)}">✎</button>` : ''}
      </div>`;
    }).join('') : '<div class="taxonomy-empty">Nenhuma categoria neste nível. Use “Nova categoria” para adicionar.</div>';
    detailEl.innerHTML = `<div class="taxonomy-detail-head"><div class="taxonomy-detail-title"><div class="taxonomy-detail-icon">${moduleGlyph(entry.moduleKey)}</div><div><h3>${esc(entry.node.label)}</h3><div class="taxonomy-breadcrumb">${entry.path.map(esc).join('　›　')}</div></div><span class="taxonomy-nav-count">${descendantCount(entry.node)} categorias</span></div>
        <div class="taxonomy-detail-actions">${canEdit ? `<button type="button" data-tax-action="edit" data-tax-key="${esc(entry.node.key)}" data-tax-parent="${esc(entry.parentKey || '')}" data-tax-module="${esc(entry.moduleKey)}">✎ Editar</button>` : ''}${canAdd ? `<button class="primary" type="button" data-tax-action="add" data-tax-key="${esc(entry.node.key)}" data-tax-parent="${esc(entry.parentKey || '')}" data-tax-module="${esc(entry.moduleKey)}">＋ Nova categoria</button>` : ''}</div>
      </div><p class="taxonomy-desc">${esc(description)}</p>
      <section class="taxonomy-category-section"><div class="taxonomy-category-heading"><h4>${entry.depth === 0 ? 'Categorias do módulo' : 'Subcategorias'}</h4><span class="taxonomy-nav-count">${children.length}</span></div><div class="taxonomy-category-list">${childRows}</div></section>
      ${canAdd ? `<button class="taxonomy-add-callout" type="button" data-tax-action="add" data-tax-key="${esc(entry.node.key)}" data-tax-parent="${esc(entry.parentKey || '')}" data-tax-module="${esc(entry.moduleKey)}"><strong>＋　Adicionar nova categoria</strong><span>Clique para adicionar ou use + ao lado de um item.</span></button>` : ''}
      ${sharedKey(entry.node.key) ? '<p class="taxonomy-category-meta">Esta categoria possui uma chave legada compartilhada e não pode ser renomeada sem afetar outro módulo.</p>' : ''}
      ${editorMarkup(entry)}`;
  };
  const selectEntry = entry => {
    if (!entry) return;
    selectedRef = {key:entry.node.key, parentKey:entry.parentKey, moduleKey:entry.moduleKey};
    addExpandedPath(entry); editing = null; renderTree(); renderDetail();
  };
  const beginCreate = (parentEntry = null) => {
    if (parentEntry && (parentEntry.depth >= 2 || sharedKey(parentEntry.node.key)))
      return toast('Este nível não permite criar outra categoria.');
    if (parentEntry) selectedRef = {key:parentEntry.node.key, parentKey:parentEntry.parentKey, moduleKey:parentEntry.moduleKey};
    else selectedRef = null;
    editing = {mode:'create', parentKey:parentEntry?.node.key || null, moduleKey:parentEntry?.moduleKey || null, depth:parentEntry?.depth ?? -1};
    if (parentEntry) addExpandedPath(parentEntry);
    renderTree(); renderDetail();
    requestAnimationFrame(() => $('#taxonomyName')?.focus());
  };
  const beginEdit = entry => {
    if (!entry || entry.node.key === 'unclassified' || sharedKey(entry.node.key)) return;
    selectedRef = {key:entry.node.key, parentKey:entry.parentKey, moduleKey:entry.moduleKey};
    editing = {mode:'edit', key:entry.node.key, parentKey:entry.parentKey, moduleKey:entry.moduleKey,
      depth:entry.depth, node:entry.node};
    addExpandedPath(entry); renderTree(); renderDetail();
    requestAnimationFrame(() => { $('#taxonomyName')?.focus(); $('#taxonomyName')?.select(); });
  };

  treeEl.onclick = e => {
    const action = e.target.closest('[data-tax-action]');
    if (action) {
      e.preventDefault(); e.stopPropagation();
      const entry = findEntry(action.dataset.taxKey, action.dataset.taxParent || null, action.dataset.taxModule);
      if (entry) beginCreate(entry);
      return;
    }
    const toggle = e.target.closest('[data-tax-toggle]');
    if (toggle) {
      e.preventDefault();
      const id = refId(toggle.dataset.taxModule, toggle.dataset.taxToggle);
      expanded.has(id) ? expanded.delete(id) : expanded.add(id);
      renderTree(); return;
    }
    if (e.target.closest('[data-tax-all]')) { selectedRef = null; editing = null; renderTree(); renderDetail(); return; }
    const select = e.target.closest('[data-tax-select]'); if (!select) return;
    selectEntry(findEntry(select.dataset.taxSelect, select.dataset.taxParent || null, select.dataset.taxModule));
  };
  detailEl.onclick = async e => {
    const action = e.target.closest('[data-tax-action]');
    if (action) {
      if (action.dataset.taxRoot === '1') { beginCreate(null); return; }
      const entry = findEntry(action.dataset.taxKey, action.dataset.taxParent || null, action.dataset.taxModule);
      if (!entry) return;
      if (action.dataset.taxAction === 'add') beginCreate(entry); else beginEdit(entry);
      return;
    }
    const select = e.target.closest('[data-tax-select]');
    if (select) {
      selectEntry(findEntry(select.dataset.taxSelect, select.dataset.taxParent || null, select.dataset.taxModule));
      return;
    }
    if (e.target.closest('[data-tax-cancel]')) { editing = null; renderDetail(); return; }
    if (!e.target.closest('[data-tax-save]')) return;
    const label = $('#taxonomyName', detailEl)?.value.trim() || '';
    if (label.length < 2) return toast('Informe um nome com pelo menos 2 caracteres.');
    const saveButton = e.target.closest('[data-tax-save]'); saveButton.disabled = true;
    try {
      const draft = editing;
      const parentKey = draft.parentKey;
      const key = draft.mode === 'edit' ? draft.key : taxonomyKeyFor(label, parentKey);
      const description = draft.depth === 0 || draft.depth === -1
        ? ($('#taxonomyDescription', detailEl)?.value.trim() || '')
        : (draft.mode === 'edit' ? (draft.node.description || '') : '');
      state.taxonomy = normalizeTaxonomy(await api('/taxonomia', {method:'POST', body:{key, label, description, parent_key:parentKey}}));
      await refresh();
      selectedRef = {key, parentKey:parentKey || null, moduleKey:draft.mode === 'create' && draft.depth === -1 ? key : draft.moduleKey};
      editing = null;
      const savedEntry = findEntry(key, parentKey || null, selectedRef.moduleKey);
      if (savedEntry) addExpandedPath(savedEntry);
      renderTree(); renderDetail();
      toast(draft.mode === 'edit' ? 'Nome atualizado.' : 'Categoria criada.');
    } catch (err) { toast(err.message); }
    finally { saveButton.disabled = false; }
  };
  $('#newRootModule').onclick = () => beginCreate(null);
  $('#taxonomySearch').oninput = e => { searchText = e.target.value.trim().toLocaleLowerCase('pt-BR'); renderTree(); };

  renderTree(); renderDetail();
  if (initial.action === 'add') {
    const entry = findEntry(initial.key);
    if (entry) beginCreate(entry);
    else beginCreate(null);
  } else if (initial.action === 'edit') beginEdit(findEntry(initial.key));
  showTrainingDialog(dlg);
}

$('#modulesBtn').onclick = () => openTaxonomyManager();

(async () => {
  try {
    state.taxonomy = normalizeTaxonomy(await api('/taxonomia'));
    state.images = await api('/imagens');
    const p = new URLSearchParams(location.search);
    const candidate = Number(p.get('candidate'));
    if (Number.isInteger(candidate) && candidate > 0 && isStandaloneCandidateReview()) {
      await openCandidate(candidate);
      return;
    }
    await refresh();
    const ticket = Number(p.get('ticket'));
    if (Number.isInteger(ticket) && ticket > 0) {
      $('#ticketInput').value = ticket;
      openTechnicalCuration(ticket);
    }
  } catch(err) {
    toast('Erro ao inicializar curadoria: ' + err.message);
  }
})();
</script>
</body>
</html>
