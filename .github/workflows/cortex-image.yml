name: Build Cortex image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements-deploy.txt
      - scripts/**
      - infra/**
      - docker-compose.yml
      - docker-compose.yaml
      - compose.portainer.yml
      - .github/workflows/cortex-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate authentication and deployment
        run: |
          mkdir -p Instrucoes_master
          pip install -r requirements-deploy.txt
          PYTHONPATH=scripts python -m unittest test_prepare_portainer_env test_web_auth test_movidesk_webhook test_movidesk_note_worker test_pilot_settings test_agent_control test_ticket_dashboard test_ticket_trends test_knowledge_access test_technician_workbench test_sync_current_tickets -v
          python -m unittest discover -s scripts -p test_deployment_config.py -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
